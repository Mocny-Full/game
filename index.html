/* #touch spans the full viewport (not just #stage) so controls can live in
   the letterbox bars beside the stage instead of covering the play field. */
#touch{position:fixed;inset:0;display:none;touch-action:none;z-index:4;pointer-events:none}
#touch.active{display:block}

// Ask for fullscreen on the first tap so the mobile browser's address bar
// gets out of the way. Must run from a user gesture, so it's called from
// invoke() rather than on load. Stops retrying once the player has
// actually left fullscreen once, so it doesn't keep re-prompting after
// they deliberately back out.
let fsEntered=false,fsDeclined=false;
function enterFullscreen(){
 if(!isTouch||fsDeclined||document.fullscreenElement)return;
 const el=document.documentElement;
 const req=el.requestFullscreen||el.webkitRequestFullscreen;
 if(req)req.call(el).catch(()=>{});
}
function onFullscreenChange(){
 if(document.fullscreenElement||document.webkitFullscreenElement){
  fsEntered=true;
 }else if(fsEntered){
  fsDeclined=true;
 }
}
document.addEventListener("fullscreenchange",onFullscreenChange);
document.addEventListener("webkitfullscreenchange",onFullscreenChange);
const joyZone=document.querySelector("#joyZone");
const joyBase=document.querySelector("#joyBase");
const joyKnob=document.querySelector("#joyKnob");
const btnDash=document.querySelector("#btnDash");
const btnPulse=document.querySelector("#btnPulse");
const btnPause=document.querySelector("#btnPause");

const touchMove={x:0,y:0};
let joyId=null,joyOrigin={x:0,y:0};
const JOY_RADIUS=52;

function setJoy(clientX,clientY,originX,originY){
 // #touch now spans the full viewport, so client coordinates map directly.
 joyBase.style.left=originX+"px";
 joyBase.style.top=originY+"px";
 joyKnob.style.left=clientX+"px";
 joyKnob.style.top=clientY+"px";
}

joyZone.addEventListener("pointerdown",e=>{
 if(joyId!==null)return;
 joyId=e.pointerId;
 joyZone.setPointerCapture(joyId);
 joyOrigin={x:e.clientX,y:e.clientY};
 setJoy(e.clientX,e.clientY,e.clientX,e.clientY);
 joyBase.classList.add("show");
});

joyZone.addEventListener("pointermove",e=>{
 if(e.pointerId!==joyId)return;
 let dx=e.clientX-joyOrigin.x;
 let dy=e.clientY-joyOrigin.y;
 const len=Math.hypot(dx,dy);
 if(len>JOY_RADIUS){dx=dx/len*JOY_RADIUS;dy=dy/len*JOY_RADIUS;}
 setJoy(joyOrigin.x+dx,joyOrigin.y+dy,joyOrigin.x,joyOrigin.y);
 touchMove.x=dx/JOY_RADIUS;
 touchMove.y=dy/JOY_RADIUS;
});

function joyRelease(e){
 if(e.pointerId!==joyId)return;
 joyId=null;
 touchMove.x=0;
 touchMove.y=0;
 joyBase.classList.remove("show");
}
joyZone.addEventListener("pointerup",joyRelease);
joyZone.addEventListener("pointercancel",joyRelease);

function tapButton(el,fn){
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  fn();
 });
}

tapButton(btnPulse,()=>pulse());
tapButton(btnPause,()=>pause());

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const random=(a,b)=>a+Math.random()*(b-a);
const choose=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{
 const r=a.slice();
 for(let i=r.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [r[i],r[j]]=[r[j],r[i]];
 }
 return r;
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

const MASTER_VOLUME=.35;
let muted=read("void-bloom-muted",false);
let audioCtx=null,masterGain=null,noiseBuffer=null,ambientNodes=null;

function ensureAudio(){
 if(audioCtx)return audioCtx;

 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=muted?0:MASTER_VOLUME;
  masterGain.connect(audioCtx.destination);
 }catch{
  audioCtx=false;
 }

 return audioCtx;
}

function wakeAudio(){
 const ctx=ensureAudio();
 if(ctx&&ctx.state==="suspended")ctx.resume();
}

function toggleMute(){
 muted=!muted;
 write("void-bloom-muted",muted);
 if(masterGain)masterGain.gain.value=muted?0:MASTER_VOLUME;
}

function tone(freq,duration,type="sine",vol=1,freqEnd=null,startDelay=0){
 const ctx=ensureAudio();
 if(!ctx)return;

 const t0=ctx.currentTime+startDelay;
 const osc=ctx.createOscillator();
 const gain=ctx.createGain();

 osc.type=type;
 osc.frequency.setValueAtTime(freq,t0);
 if(freqEnd)osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd),t0+duration);

 gain.gain.setValueAtTime(vol,t0);
 gain.gain.exponentialRampToValueAtTime(.001,t0+duration);

 osc.connect(gain);
 gain.connect(masterGain);
 osc.start(t0);
 osc.stop(t0+duration);
}

function getNoiseBuffer(ctx){
 if(!noiseBuffer){
  noiseBuffer=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const data=noiseBuffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
 }
 return noiseBuffer;
}

function noiseBurst(duration,vol=1,filterFreq=1000,filterType="lowpass"){
 const ctx=ensureAudio();
 if(!ctx)return;

 const t0=ctx.currentTime;
 const src=ctx.createBufferSource();
 const filter=ctx.createBiquadFilter();
 const gain=ctx.createGain();

 src.buffer=getNoiseBuffer(ctx);
 filter.type=filterType;
 filter.frequency.value=filterFreq;

 gain.gain.setValueAtTime(vol,t0);
 gain.gain.exponentialRampToValueAtTime(.001,t0+duration);

 src.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);
 src.start(t0);
 src.stop(t0+duration);
}

function startAmbient(intense){
 const ctx=ensureAudio();
 if(!ctx||ambientNodes)return;

 const osc1=ctx.createOscillator();
 const osc2=ctx.createOscillator();
 const filter=ctx.createBiquadFilter();
 const gain=ctx.createGain();
 const lfo=ctx.createOscillator();
 const lfoGain=ctx.createGain();

 // A boss fight swaps the fifth for a tritone and speeds/deepens the
 // filter LFO — same drone, more tension.
 osc1.type="sine";osc1.frequency.value=55;
 osc2.type="sine";osc2.frequency.value=intense?55*1.414:55*1.5;
 filter.type="lowpass";filter.frequency.value=intense?420:300;
 gain.gain.value=0;
 gain.gain.linearRampToValueAtTime(intense?.07:.05,ctx.currentTime+2);

 lfo.frequency.value=intense?.12:.05;
 lfoGain.gain.value=intense?220:150;
 lfo.connect(lfoGain);
 lfoGain.connect(filter.frequency);

 osc1.connect(filter);
 osc2.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);

 osc1.start();
 osc2.start();
 lfo.start();

 ambientNodes={osc1,osc2,lfo,gain};
}

function stopAmbient(){
 if(!ambientNodes||!audioCtx)return;

 const {osc1,osc2,lfo,gain}=ambientNodes;
 const t=audioCtx.currentTime;

 gain.gain.cancelScheduledValues(t);
 gain.gain.setValueAtTime(gain.gain.value,t);
 gain.gain.linearRampToValueAtTime(0,t+1);
 osc1.stop(t+1.1);
 osc2.stop(t+1.1);
 lfo.stop(t+1.1);

 ambientNodes=null;
}

function resize(){
 const r=canvas.getBoundingClientRect();

 // iOS briefly reports a zero-size rect mid-rotation; skip rather than
 // collapse the canvas's backing buffer to 0x0 (which renders nothing).
 if(!r.width||!r.height)return;

 const scale=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(r.width*scale);
 canvas.height=Math.round(r.height*scale);

 // Publish the stage's letterbox geometry as CSS vars so the touch
 // controls (now positioned relative to the full viewport) can sit in
 // the side bars beside the stage instead of on top of the play field.
 const barL=r.left,barR=innerWidth-r.right;
 const root=document.documentElement.style;
 root.setProperty("--barL",barL+"px");
 root.setProperty("--barR",barR+"px");
 root.setProperty("--stageTop",r.top+"px");
 root.setProperty("--stageBottom",(innerHeight-r.bottom)+"px");
 root.setProperty("--stageW",r.width+"px");
 root.setProperty("--stageH",r.height+"px");

 // Only usable as dedicated rails once they're wide enough for a 76px
 // button plus breathing room; otherwise fall back to overlaying the
 // stage's corners like before.
 touchUI.classList.toggle("bars",barL>=92&&barR>=92);
}
addEventListener("resize",resize);

// ResizeObserver reacts to the actual settled layout size instead of
// guessing a delay after orientationchange, which iOS Safari can fire
// before the rotation's layout has finished settling.
if(window.ResizeObserver){
 new ResizeObserver(resize).observe(canvas);
}else{
 addEventListener("orientationchange",()=>setTimeout(resize,300));
}
resize();

function isFinalBossRoom(){return Math.floor(R.depth/7)===3}

function bossDepthAhead(){
 const next=R.depth+1;
 return next%7===0&&next<=28;
}

function rank(id){return R?.mods?.[id]||0}
function weaponRank(id){return R?.weapons?.[id]||0}
function metaRank(id){return meta.upgrades[id]||0}
function xpNeeded(){return Math.floor(48+R.level*30+Math.pow(R.level,1.35)*5)}
function heal(n){R.hp=Math.min(S.maxHp,R.hp+n)}

function calculate(){
 const f=FRAMES.find(x=>x.id===R.frame)||FRAMES[0];

 S={
  maxHp:f.hp+rank("armor")+metaRank("vitality"),
  speed:f.speed*(1+.12*rank("speed")),
  damage:f.damage*Math.pow(1.24,rank("power")),
  rate:f.rate/Math.pow(1.16,rank("rate")),
  shots:f.shots+rank("spread"),
  pierce:rank("pierce"),
  dashCD:f.dash*Math.pow(.9,rank("dash")),
  dashDamage:70+30*rank("dash"),

  // Pulse deliberately recharges much more slowly.
 pulseCost:100*Math.pow(.95,rank("pulse")),
pulseDamage:190+70*rank("pulse"),

// Pulse now takes considerably longer to recharge.
energyRate:.42+rank("battery")*.42
 };

 R.hp=Math.min(R.hp,S.maxHp);
 if(P)P.energy=Math.min(P.energy,S.pulseCost);
}

function show(title,sub,cards=[],buttons=[],extra=""){
 state="menu";
 keys.clear();
 actions=[];
 touchUI.classList.remove("active");

 const cardHTML=cards.map((a,i)=>{
  if(!a.disabled)actions[i]=a.fn;
  return `<button type="button" class="card" data-action="${i}" ${a.disabled?"disabled":""}>
   <em>${i+1} / ${esc(a.tag||"CHOICE")}</em>
   <h3>${esc(a.title)}</h3>
   <p>${esc(a.desc||"")}</p>
   ${a.lore?`<p class="lore">${esc(a.lore)}</p>`:""}
   ${a.foot?`<small>${esc(a.foot)}</small>`:""}
  </button>`;
 }).join("");

 const buttonHTML=buttons.map((a,i)=>{
  const n=cards.length+i;
  if(!a.disabled)actions[n]=a.fn;
  return `<button type="button" class="button ${a.secondary?"secondary":""}" data-action="${n}" ${a.disabled?"disabled":""}>${esc(a.title)}</button>`;
 }).join("");

 overlay.innerHTML=`<div class="panel">
  <div class="eyebrow">VOID BLOOM / ECHOES</div>
  <h1>${title}</h1>
  <div class="sub">${sub}</div>
  ${extra}
  ${cards.length?`<div class="cards">${cardHTML}</div>`:""}
  <div class="buttons">${buttonHTML}</div>
  <div class="small">${isTouch?"TAP TO CHOOSE · LEFT SIDE JOYSTICK MOVES · DASH / PULSE BUTTONS · II PAUSE":"CLICK OR PRESS NUMBER KEYS · WASD / ARROWS MOVE · SPACE DASH · E PULSE · P PAUSE"}</div>
 </div>`;

 overlay.classList.remove("hidden");
 overlay.querySelectorAll("[data-action]").forEach(b=>{
  b.addEventListener("click",()=>invoke(Number(b.dataset.action)));
 });
}

function invoke(i){
 const fn=actions[i];
 if(typeof fn!=="function")return;
 wakeAudio();
 enterFullscreen();
 sfx.click();
 actions=[];
 fn();
}

function hide(){
 overlay.classList.add("hidden");
 keys.clear();
 actions=[];
 state="playing";
 if(isTouch)touchUI.classList.add("active");
}

function title(){
 R=null;S=null;P=null;room=null;
 enemies=[];bullets=[];orbs=[];hazards=[];
 stopAmbient();

 show("VOID BLOOM<br><span>ECHOES</span>",

  [],
  [
   {title:"NEW EXPEDITION",fn:frameSelect},
   {title:"THE GARDEN",secondary:true,fn:garden},
   {title:"HOW TO PLAY",secondary:true,fn:help},
   {title:muted?"SOUND: OFF":"SOUND: ON",secondary:true,fn:()=>{toggleMute();title();}}
  ],
  `<div class="small">BEST ${meta.best.toLocaleString()} · ${meta.wins} VICTORIES · ${meta.spores} SPORES<br>
  ${isTouch?"LEFT SIDE JOYSTICK MOVES · DASH / PULSE BUTTONS":"SPACE DASH · E PULSE · WASD / ARROWS MOVE"}</div>`);
}

function upgradeCost(u,r){return u.baseCost*(r+1)}

function garden(){
 show("TEND THE <span>GARDEN</span>",
  "Spend spores on permanent upgrades. Every future expedition starts with whatever is unlocked here.",
  META_UPGRADES.map(u=>{
   const r=metaRank(u.id);
   const maxed=r>=u.max;
   const cost=upgradeCost(u,r);

   return {
    title:u.name,
    tag:maxed?"MAXED":`${cost} SPORES`,
    desc:u.desc,
    foot:`RANK ${r}/${u.max}`,
    disabled:maxed||meta.spores<cost,
    fn:()=>{
     meta.spores-=cost;
     meta.upgrades[u.id]=r+1;
     write(META,meta);
     sfx.purchase();
     garden();
    }
   };
  }),
  [{title:"BACK",secondary:true,fn:title}],
  `<div class="small">SPORES ${meta.spores}</div>`);
}

function begin(frame){
 R={
  frame,depth:0,level:1,xp:0,
  hp:0,
  mods:{},weapons:{},kills:0,score:0,scrap:30+metaRank("cache")*10,time:0,
  rerolls:2+metaRank("memory"),
  lastReflectionDepth:-99,
  mutationPicks:0
 };
 calculate();
 R.hp=S.maxHp;

 if(metaRank("headstart")){
  mutationChoice(route,"HEAD START — CHOOSE A <span>MUTATION</span>");
 }else{
  route();
 }
}

const NODE_INFO={
 combat:{title:"COMBAT",tag:"FIVE WAVES",desc:"Escalating enemy waves.",fn:()=>enter("combat")},
 elite:{title:"ELITE",tag:"SIX WAVES",desc:"Stronger enemies, faster projectiles, better rewards.",fn:()=>enter("elite")},
 rest:{title:"REST",tag:"RECOVERY",desc:"Repair 35% HP and choose a mutation. The depth still advances.",fn:rest},
 shop:{title:"SHOP",tag:()=>`${R.scrap} SCRAP`,desc:"Spend scrap on repairs, reroll tokens, or a guaranteed mutation.",fn:shop},
 unknown:{title:"UNKNOWN",tag:"???",desc:"An uncertain encounter. Could be a blessing, could cost you.",fn:unknownEvent}
};

const NODE_COLOR={combat:"var(--ink)",elite:"var(--pink)",rest:"var(--mint)",shop:"var(--gold)",unknown:"var(--violet)"};
const NODE_LETTER={combat:"C",elite:"E",rest:"R",shop:"$",unknown:"?"};

function generateActMap(){
 const pool=["elite","rest","shop","unknown"];
 R.actMap=[];
 R.actPicks=[];

 for(let i=0;i<6;i++){
  R.actMap.push(["combat",...shuffle(pool).slice(0,2)]);
 }

 R.mapAct=Math.floor(R.depth/7);
}

function pathMapHTML(){
 if(!R.actMap)return "";

 const cur=R.depth%7;
 const cells=R.actMap.map((opts,i)=>{
  const st=i<cur?"done":i===cur?"now":"next";
  const pick=R.actPicks&&R.actPicks[i];
  const opts_html=opts.map(id=>
   `<span class="pn-opt${pick===id?" picked":""}" style="--c:${NODE_COLOR[id]}">${NODE_LETTER[id]}</span>`
  ).join("");
  return `<div class="pn ${st}">${opts_html}</div>`;
 }).join("");

 const bossState=cur>=6?"now":"next";

 return `<div class="pathmap">${cells}<div class="pn boss ${bossState}"><span class="pn-opt picked" style="--c:var(--pink)">G</span></div></div>`;
}

function route(){
 room=null;P=null;enemies=[];bullets=[];orbs=[];hazards=[];
 shopStock=null;

 const biome=BIOMES[Math.min(3,Math.floor(R.depth/7))];
 const boss=bossDepthAhead()?BOSSES[Math.floor(R.depth/7)]:null;

 let cards;

 if(boss){
  cards=[
   {title:"BOSS",tag:"GUARDIAN",desc:`${boss.name} blocks the way into the next biome.`,fn:()=>enter("boss")},
   {title:"SHOP",tag:`${R.scrap} SCRAP`,desc:"Spend scrap on repairs, reroll tokens, or a guaranteed mutation.",fn:shop}
  ];
 }else{
  if(R.mapAct!==Math.floor(R.depth/7))generateActMap();

  cards=R.actMap[R.depth%7].map(id=>{
   const info=NODE_INFO[id];
   return {title:info.title,tag:typeof info.tag==="function"?info.tag():info.tag,desc:info.desc,fn:info.fn};
  });
 }

 show(`${biome.name.split(" ")[0]} <span>${biome.name.split(" ").slice(1).join(" ")}</span>`,
  boss?"A guardian stands between you and the next biome. There is no way around it.":"Choose the next pressure test. Not every path offers the same options.",
  cards,
  [
   {title:"BUILD",secondary:true,fn:build},
   {title:"TITLE",secondary:true,fn:title}
  ],
  `${pathMapHTML()}<div class="small">ROOM ${R.depth+1} · LEVEL ${R.level} · HP ${R.hp}/${S.maxHp} · SCORE ${R.score}</div>`);
}

function rest(){
 if(R.actPicks)R.actPicks[R.depth%7]="rest";
 R.depth++;
 heal(Math.ceil(S.maxHp*.35));
 mutationChoice(route,"REST — CHOOSE A <span>MUTATION</span>");
}

function unknownEvent(){
 if(R.actPicks)R.actPicks[R.depth%7]="unknown";
 R.depth++;

 const roll=Math.random();

 if(roll<.35){
  const amount=40+Math.floor(R.depth*3);
  R.scrap+=amount;
  show("A SEED <span>CRACKS OPEN</span>",
   `Something valuable was buried here. +${amount} scrap.`,
   [],
   [{title:"CONTINUE",fn:route}]);
 }else if(roll<.6){
  heal(Math.ceil(S.maxHp*.5));
  show("THE GARDEN <span>REMEMBERS</span>",
   "Integrity restored, but nothing more.",
   [],
   [{title:"CONTINUE",fn:route}]);
 }else if(roll<.85){
  const dmg=Math.random()<.5?1:2;
  R.hp-=dmg;
  sfx.hit();

  if(R.hp<=0){
   beginDeath();
   return;
  }

  R.scrap+=60;
  show("SOMETHING <span>STIRS</span>",
   `An ambush costs ${dmg} integrity — but you salvage 60 scrap from the wreckage.`,
   [],
   [{title:"CONTINUE",fn:route}]);
 }else{
  R.hp-=1;
  sfx.hit();

  if(R.hp<=0){
   beginDeath();
   return;
  }

  show("A CACHE <span>OVERGROWN</span>",
   "Thorns guard something useful. It costs 1 integrity to reach.",
   [],
   [{title:"CONTINUE",fn:()=>mutationChoice(route,"CHOOSE A <span>MUTATION</span>")}]);
 }
}

function enter(type){
 const endless=R.depth>=28;

 room={
  type:endless?"endless":type,
  depth:R.depth+1,
  wave:0,
  maxWaves:endless?999:type==="elite"?6:5,
  wait:1,
  time:0,
  pending:[],
  kills:0,
  target:endless?100+Math.floor((R.depth-27)*30):0,
  clear:0,
  bossSpawned:false
 };

 startCombat();
}

function startCombat(){
 enemies=[];bullets=[];orbs=[];hazards=[];
 P={
  x:600,y:580,r:12,dx:0,dy:-1,angle:-Math.PI/2,
  dash:0,dashCD:0,

  // Pulse starts partly charged but cannot be spammed.
  energy:22,

  fire:0,inv:1,
  hits:new Set(),orbit:0,wake:0,
  lanceFire:0,chainFire:0
 };

}

function build(){
 const mods=MUTATIONS.filter(x=>rank(x.id));
 const owned=WEAPONS.filter(x=>weaponRank(x.id));

 show("YOUR <span>BUILD</span>",
  `LEVEL ${R.level} · HP ${R.hp}/${S.maxHp} · DAMAGE ${S.damage.toFixed(1)} · DASH ${S.dashCD.toFixed(2)}s · PULSE ${S.pulseCost.toFixed(0)} ENERGY`,
  [],
  [{title:"BACK",fn:route}],
  `<div>${owned.map(x=>`<span class="badge">${x.name} ${weaponRank(x.id)}/${x.max}</span>`).join("")}${mods.map(x=>`<span class="badge">${x.name} ${rank(x.id)}/${x.max}</span>`).join("")||(owned.length?"":"No mutations yet.")}</div>`);
}

function pickNote(){
 const tier=NOTES[Math.min(3,Math.floor(R.depth/7))];
 return choose(tier);
}

function shop(){
 if(!shopStock){
  const mpool=MUTATIONS.filter(x=>rank(x.id)<x.max);
  const wpool=WEAPONS.filter(x=>weaponRank(x.id)<x.max);

  shopStock={
   mutation:mpool.length?choose(mpool).id:null,
   // Weapons and notes are scarce finds, not guaranteed stock like the
   // mutation offer — most shop visits won't have either.
   weapon:(wpool.length&&Math.random()<.45)?choose(wpool).id:null,
   note:Math.random()<.4?pickNote():null
  };
 }

 // Priced against a normal combat room's ~55-60 scrap so one room's income
 // affords about one purchase here, not a shopping spree.
 const repairCost=Math.ceil((S.maxHp-R.hp)*12);
 const rerollCost=40;
 const noteCost=18;
 const mut=shopStock.mutation?MUTATIONS.find(m=>m.id===shopStock.mutation):null;
 const mutCost=mut?35+rank(mut.id)*30:0;
 const wep=shopStock.weapon?WEAPONS.find(w=>w.id===shopStock.weapon):null;
 const wepRank=wep?weaponRank(wep.id):0;
 const wepCost=wep?50+wepRank*40:0;

 const cards=[
  {
   title:"FULL REPAIR",
   tag:`${repairCost} SCRAP`,
   desc:"Restore integrity to maximum.",
   foot:`${R.hp}/${S.maxHp} HP`,
   disabled:R.hp>=S.maxHp||R.scrap<repairCost,
   fn:()=>{
    R.scrap-=repairCost;
    heal(S.maxHp);
    sfx.purchase();
    shop();
   }
  },
  {
   title:"REROLL TOKEN",
   tag:`${rerollCost} SCRAP`,
   desc:"Gain one extra mutation reroll.",
   foot:`${R.rerolls} REROLLS HELD`,
   disabled:R.scrap<rerollCost,
   fn:()=>{
    R.scrap-=rerollCost;
    R.rerolls++;
    sfx.purchase();
    shop();
   }
  },
  mut?{
   title:mut.name,
   tag:`${mutCost} SCRAP`,
   desc:mut.desc,
   lore:R.mutationPicks>=MUTATION_DEEP_THRESHOLD?mut.loreLate:mut.loreEarly,
   foot:`RANK ${rank(mut.id)+1}/${mut.max}`,
   disabled:R.scrap<mutCost,
   fn:()=>{
    R.scrap-=mutCost;
    R.mods[mut.id]=rank(mut.id)+1;
    R.mutationPicks++;
    calculate();
    if(mut.id==="armor")heal(2);
    const remaining=MUTATIONS.filter(x=>rank(x.id)<x.max);
    shopStock.mutation=remaining.length?choose(remaining).id:null;
    sfx.purchase();
    shop();
   }
  }:{
   title:"SOLD OUT",
   tag:"—",
   desc:"Every mutation has already reached maximum rank.",
   disabled:true
  }
 ];

 // Weapons are the player's own — reclaimed, never granted, always at a
 // price. Unlike the mutation slot, this one isn't always stocked.
 if(wep){
  cards.push({
   title:wep.name,
   tag:wepRank===0?`${wepCost} SCRAP · NEW`:`${wepCost} SCRAP`,
   desc:wep.desc,
   lore:wep.lore,
   foot:`RANK ${wepRank+1}/${wep.max}`,
   disabled:R.scrap<wepCost,
   fn:()=>{
    R.scrap-=wepCost;
    R.weapons[wep.id]=wepRank+1;
    calculate();
    const remaining=WEAPONS.filter(x=>weaponRank(x.id)<x.max);
    shopStock.weapon=remaining.length?choose(remaining).id:null;
    sfx.purchase();
    shop();
   }
  });
 }

 if(shopStock.note){
  cards.push({
   title:"WEATHERED NOTE",
   tag:`${noteCost} SCRAP`,
   desc:"Someone left this behind. Reading it won't help you fight.",
   foot:"???",
   disabled:R.scrap<noteCost,
   fn:()=>{
    R.scrap-=noteCost;
    const text=shopStock.note;
    shopStock.note=null;
    sfx.purchase();
    show("A WEATHERED <span>NOTE</span>",
     text,
     [],
     [{title:"CONTINUE",fn:shop}]);
   }
  });
 }

 show("SUPPLY <span>CACHE</span>",
  `Trade scrap for guaranteed upgrades. Everything here is permanent, but it costs what fighting would have earned instead.`,
  cards,
  [{title:"LEAVE",secondary:true,fn:route}],
  `<div class="small">SCRAP ${R.scrap}</div>`);
}

function mutationChoice(done,title="LEVEL UP — CHOOSE A <span>MUTATION</span>"){
 // Weapons are never offered here — they're the player's own pieces, only
 // ever reclaimed with scrap in the shop. This screen is purely the
 // garden's gifts.
 const pool=shuffle(MUTATIONS.filter(x=>rank(x.id)<x.max)).slice(0,3);

 if(!pool.length){
  heal(2);
  sfx.levelUp();
  show("FULLY <span>BLOOMED</span>",
   "Every mutation has reached its maximum rank. The garden has nothing left to offer — 2 integrity repaired instead.",
   [],
   [{title:"CONTINUE",fn:done}]);
  return;
 }

 sfx.levelUp();
 show(title,
  "Read the cards. Your build is the main source of power.",
  pool.map(m=>{
   const current=rank(m.id);

   return {
    title:m.name,
    tag:m.tag,
    desc:m.desc,
    lore:R.mutationPicks>=MUTATION_DEEP_THRESHOLD?m.loreLate:m.loreEarly,
    foot:`RANK ${current+1}/${m.max}`,
    fn:()=>{
     R.mods[m.id]=current+1;
     R.mutationPicks++;
     if(m.id==="armor")heal(2);
     calculate();
     done();
    }
   };
  }),
  [
   {
    title:`REROLL (${R.rerolls})`,
    secondary:true,
    disabled:R.rerolls<=0,
    fn:()=>{
     R.rerolls--;
     mutationChoice(done,title);
    }
   },
   {
    // Without a way to decline, the 0-mutation ending is unreachable —
    // levels (and thus mutation offers) happen automatically from combat
    // XP, with no other way through a run.
    title:"REFUSE",
    secondary:true,
    fn:done
   }
  ]);
}

function levelCheck(done){
 if(R.xp<xpNeeded()){
  done();
  return;
 }

 R.xp-=xpNeeded();
 R.level++;
 mutationChoice(()=>levelCheck(done));
}

function spawn(type,x,y,elite=false){
 const base=ENEMIES[type];
 if(!base||enemies.length>=48)return null;

 if(x===undefined){
  const side=Math.floor(Math.random()*4);
  x=side===0?35:side===1?W-35:random(40,W-40);
  y=side===2?TOP+35:side===3?BOTTOM-35:random(TOP+35,BOTTOM-35);
 }

 const difficulty=
  (1+R.depth*.17)*
  (room.type==="elite"?1.3:1)*
  (room.type==="endless"?1.35+R.depth*.015:1);

 const e={
  ...base,type,x,y,elite,
  hp:base.hp*difficulty,
  maxHp:base.hp*difficulty,
  born:.7,dead:false,id:Math.random(),
  tell:0,aim:0,fire:random(.5,1.8),charge:0,
  phase:random(0,TAU),age:0,slow:0,burn:0,
  orbitHit:0,hit:0
 };

 enemies.push(e);
 return e;
}

function wave(){
 room.wave++;
 sfx.wave();

 let count=13+room.wave*4+Math.floor(R.depth*.8);
 if(room.type==="elite")count+=9;

 // Heavy, slow tanks lead the enemy roster; the ranged tri-shot gunner
 // shows up later. Their arrival dilutes gunner's share of the pool, so
 // the ranged threat naturally eases off right as tanks start soaking hits.
 let pool=["seeker","seeker","seeker","tank"];
 if(R.depth>1)pool.push("charger");
 if(R.depth>3)pool.push("gunner","sniper");
 if(R.depth>7)pool.push("summoner");

 for(let i=0;i<count;i++){
  room.pending.push({
   at:room.time+.35+i*.25,
   type:choose(pool)
  });
 }

 label(
  600,155,
  `WAVE ${room.wave}/${room.maxWaves}`,
  room.type==="elite"?C.gold:C.white,
  1.5
 );

 // An occasional chaotic-neutral encounter: a hostile echo of the player's
 // own build that fires at whatever is nearest, friend or foe, then leaves.
 if(
  !room.reflectionSpawned&&
  R.depth>=2&&
  R.depth-R.lastReflectionDepth>=3&&
  Math.random()<.2
 ){
  spawnReflection();
 }
}

function makeHazard(){
  const dangerous=room.type==="elite"||room.type==="endless";
  const blast=dangerous&&Math.random()<.42;

  hazards.push({
    type:blast?"blast":"slow",
    x:random(130,W-130),
    y:random(TOP+100,BOTTOM-100),
    r:blast?82:(dangerous?112:92),
    delay:blast?1.25:.8,
    age:0,
    duration:blast?.48:(dangerous?8:6),
    dead:false,
    hit:false
  });
}

function updateHazards(dt){
  for(const h of hazards){
    h.age+=dt;

    if(h.type==="blast"){
      const active=h.age>=h.delay;

      if(active&&!h.hit){
        h.hit=true;

        if(distance(P,h)<h.r+P.r){
          if(P.dash<=0)hurt();
          if(!P)return;
        }

        // Damage enemies caught in the explosion.
        for(const e of enemies){
          if(!e.dead&&distance(e,h)<h.r+e.r){
            damageEnemy(e,95);
          }
        }

        sfx.blast();
        ring(h.x,h.y,C.gold,h.r*1.5,.35);
        burst(h.x,h.y,C.gold,30,260);
        shake=7;
      }
    }

    if(h.age>h.delay+h.duration){
      h.dead=true;
    }
  }

  hazards=hazards.filter(h=>!h.dead);
}

function playerSlowMultiplier(){
 for(const h of hazards){
  if(h.type==="slow"&&h.age>=h.delay&&distance(P,h)<h.r)return .35;
 }
 return 1;
}

function updatePlayer(dt){
 P.inv=Math.max(0,P.inv-dt);
 P.dashCD=Math.max(0,P.dashCD-dt);

 // Slow energy regeneration. Kills no longer recharge pulse energy.
 P.energy=Math.min(S.pulseCost,P.energy+S.energyRate*dt);
 P.fire-=dt;
 P.orbit+=dt*2.5;

 const mx=+(keys.has("d")||keys.has("arrowright"))-
  +(keys.has("a")||keys.has("arrowleft"))+touchMove.x;

 const my=+(keys.has("s")||keys.has("arrowdown"))-
  +(keys.has("w")||keys.has("arrowup"))+touchMove.y;

 const len=Math.hypot(mx,my)||1;
 const slow=playerSlowMultiplier();

 if(P.dash>0){
  P.x+=P.dx*1000*dt;
  P.y+=P.dy*1000*dt;
  P.dash-=dt;
  P.wake-=dt;

  if(rank("wake")&&P.wake<=0){
   hazards.push({
    type:"damage",
    x:P.x,y:P.y,
    r:38+rank("wake")*8,
    delay:0,age:0,duration:1.2,dead:false
   });
   P.wake=.1;
  }
 }else{
  P.x+=mx/len*S.speed*slow*dt;
  P.y+=my/len*S.speed*slow*dt;

  if(mx||my){
   P.dx=mx/len;
   P.dy=my/len;
   P.angle=Math.atan2(P.dy,P.dx);
  }
 }

 P.x=clamp(P.x,25,W-25);
 P.y=clamp(P.y,TOP+25,BOTTOM-25);

 if(P.fire<=0)firePlayer();

 for(const h of hazards){
  if(h.type==="damage"){
   for(const e of enemies){
    if(!e.dead&&distance(e,h)<h.r+e.r){
     damageEnemy(e,20*rank("wake")*dt);
    }
   }
  }
 }

 updateWeapons(dt);
}

function updateWeapons(dt){
 const haloCount=weaponRank("halo");

 if(haloCount>0){
  const haloDamage=18+weaponRank("halo")*10;

  for(let i=0;i<haloCount;i++){
   const a=P.orbit+i*TAU/haloCount;
   const point={
    x:P.x+Math.cos(a)*68,
    y:P.y+Math.sin(a)*68
   };

   for(const e of enemies){
    if(!e.dead&&!e.orbitHit&&distance(point,e)<e.r+10){
     e.orbitHit=.25;
     damageEnemy(e,haloDamage);
    }
   }
  }
 }

 if(weaponRank("lance")>0){
  P.lanceFire-=dt;

  if(P.lanceFire<=0){
   const target=nearest(P.x,P.y);

   if(target){
    const a=angle(P,target);
    const range=420;
    const ex=P.x+Math.cos(a)*range;
    const ey=P.y+Math.sin(a)*range;
    const damage=26+weaponRank("lance")*14;

    for(const e of enemies){
     if(!e.dead&&pointSegment(e.x,e.y,P.x,P.y,ex,ey)<e.r+6){
      damageEnemy(e,damage);
     }
    }

    beams.push({x1:P.x,y1:P.y,x2:ex,y2:ey,life:.15,max:.15,color:C.violet});
    sfx.lance();
    P.lanceFire=1.7-weaponRank("lance")*.15;
   }
  }
 }

 if(weaponRank("chain")>0){
  P.chainFire-=dt;

  if(P.chainFire<=0){
   let source={x:P.x,y:P.y};
   const hitIds=new Set();
   const jumps=weaponRank("chain")+1;
   const damage=20+weaponRank("chain")*10;
   let any=false;

   for(let i=0;i<jumps;i++){
    let best=null,bestDist=270;

    for(const e of enemies){
     if(e.dead||e.born>0||hitIds.has(e.id))continue;

     const d=Math.hypot(e.x-source.x,e.y-source.y);
     if(d<bestDist){
      bestDist=d;
      best=e;
     }
    }

    if(!best)break;

    damageEnemy(best,damage);
    hitIds.add(best.id);
    beams.push({x1:source.x,y1:source.y,x2:best.x,y2:best.y,life:.2,max:.2,color:C.gold});
    source={x:best.x,y:best.y};
    any=true;
   }

   if(any){
    sfx.chain();
    P.chainFire=2.1-weaponRank("chain")*.15;
   }
  }
 }
}

function firePlayer(){
 const target=nearest(P.x,P.y);
 if(!target)return;

 P.angle=angle(P,target);

 for(let i=0;i<S.shots;i++){
  const spread=(i-(S.shots-1)/2)*.1;
  bullet(P.x,P.y,P.angle+spread,760,true,S.damage);
 }

 sfx.shoot();
 P.fire=S.rate;
}

function nearest(x,y){
 let result=null,best=Infinity;

 for(const e of enemies){
  if(e.dead||e.born>0)continue;

  const n=Math.hypot(e.x-x,e.y-y);
  if(n<best){
   best=n;
   result=e;
  }
 }

 return result;
}

// playerDmg is separate from `damage` (which is only ever used against
// enemies, via damageEnemy) so overdrive enemies can hit the player harder
// without touching the existing damage field's established meaning
// elsewhere (e.g. the Reflection's much larger anti-enemy chaos damage).
function bullet(x,y,a,speed,good,damage,ownerId=null,playerDmg=1){
 if(bullets.length>700)return;

 bullets.push({
  x,y,px:x,py:y,
  vx:Math.cos(a)*speed,
  vy:Math.sin(a)*speed,
  good,damage,ownerId,playerDmg,
  life:good===true?2.3:6,
  r:good===true?4:5,
  hits:good===true?1+S.pierce:1,
  seen:new Set(),
  dead:false
 });
}

function damageEnemy(e,damage){
 if(!e||e.dead||e.born>0)return;

 if(e.type==="boss"&&e.hit<=0){
  sfx.bossHit();
 }

 e.hp-=damage;
 e.hit=.08;

 if(e.hp>0)return;

 e.dead=true;

 if(e.type==="boss"){
  R.kills++;
  room.kills++;
  R.score+=e.isReflection?3000:2000;
  R.scrap+=e.isReflection?200:150;
  orbs.push({x:e.x,y:e.y,value:e.isReflection?60:40});

  sfx.bossDefeat();
  burst(e.x,e.y,e.color,60,320);
  ring(e.x,e.y,e.color,140,.6);
  shake=14;
  label(e.x,e.y-60,e.isReflection?"THE GARDEN YIELDS":"GUARDIAN FELLED",e.color,1.8);
  return;
 }

 if(e.type==="reflection"){
  R.kills++;
  room.kills++;
  R.score+=400;
  R.scrap+=20;
  orbs.push({x:e.x,y:e.y,value:15});

  sfx.reflectionShatter();
  burst(e.x,e.y,C.spectral,40,260);
  ring(e.x,e.y,C.spectral,90,.5);
  shake=10;
  label(e.x,e.y-50,"REFLECTION SHATTERED",C.spectral,1.5);
  return;
 }

 R.kills++;
 room.kills++;
 R.score+=e.elite?160:85;

 // Wave sizes run into the hundreds per room, so kill-scrap must stay
 // small and mostly-elite or it dwarfs the room-clear/event rewards.
 if(e.elite)R.scrap+=3;
 else if(Math.random()<.25)R.scrap+=1;

 // Pulse does not recharge from ordinary kills anymore.
 orbs.push({x:e.x,y:e.y,value:e.xp});

 sfx.enemyDeath();
 burst(e.x,e.y,e.color,14,160);

 if(room.type==="endless"&&room.kills%25===0){
  label(P.x,P.y-40,`${room.kills} KILLS`,C.gold,1.2);
}
}

function hurt(dmg=1){
 if(P.inv>0||P.dash>0)return;

 R.hp-=dmg;
 P.inv=1.1;
 shake=8;
 sfx.hit();

 if(R.hp<=0)beginDeath();
}

// A brief on-canvas flash at the moment of death, before the game-over
// screen — not always shown, first-person, never explaining itself.
function beginDeath(){
 if(state==="dying")return;
 state="dying";

 if(Math.random()<.7){
  label(600,340,choose(DEATH_ECHOES),C.spectral,1.6);
 }

 setTimeout(()=>{
  if(state==="dying")finish(false);
 },900);
}

function spawnBoss(){
 const def=BOSSES[Math.min(3,Math.floor(R.depth/7))];
 const hpScale=1+R.depth*.1;

 const boss={
  type:"boss",shape:"boss",
  name:def.name,color:def.color,
  x:600,y:230,r:46,
  hp:850*hpScale,maxHp:850*hpScale,
  elite:true,born:1.2,dead:false,id:Math.random(),
  age:0,slow:0,burn:0,hit:0,orbitHit:0,
  tell:0,aim:0,
  attackIndex:0,attackTimer:2.5,
  chargeState:0,chargeAim:0,chargeTimer:0,
  enrageStage:0
 };

 enemies.push(boss);
 sfx.bossSpawn();
 return boss;
}

// The garden's last line of defense: a second, secret phase after the act-4
// guardian falls. Built from the same boss template as every other
// guardian (HP bar, telegraphs, enrage stages all come for free), but adds
// a fourth attack — reflectionMirrorVolley — that scales with whatever
// weapons and mutations the player actually brought into the fight.
function spawnReflectionFinal(){
 const hpScale=1+R.depth*.1;

 const boss={
  type:"boss",shape:"boss",isReflection:true,
  name:"THE REFLECTION",color:C.spectral,
  x:600,y:230,r:44,
  hp:1150*hpScale,maxHp:1150*hpScale,
  elite:true,born:1.4,dead:false,id:Math.random(),
  age:0,slow:0,burn:0,hit:0,orbitHit:0,
  tell:0,aim:0,
  attackIndex:0,attackTimer:2.2,
  chargeState:0,chargeAim:0,chargeTimer:0,
  enrageStage:0
 };

 enemies.push(boss);
 sfx.reflectionAppear();
 sfx.bossSpawn();
 label(600,175,"IT HAS SEEN ENOUGH",C.spectral,2.4);
 return boss;
}

// Fires a spread whose width mirrors how much the player has invested in
// their build (weapon ranks + spread mutation). In chaotic mode, half the
// shots pick a random living enemy instead of the player — used by the
// roaming encounter; the final boss always fires it player-only.
function reflectionMirrorVolley(e,chaotic){
 const shots=3+weaponRank("halo")+weaponRank("lance")+weaponRank("chain")+rank("spread");
 const dmg=14+R.depth*.6;
 const baseAngle=angle(e,P);

 for(let i=0;i<shots;i++){
  const spread=(i-(shots-1)/2)*.16;
  let a=baseAngle+spread;

  if(chaotic&&Math.random()<.5){
   const foes=enemies.filter(x=>!x.dead&&x!==e&&x.type!=="reflection");
   const foe=foes.length?choose(foes):null;
   if(foe)a=angle(e,foe)+spread;
  }

  bullet(e.x,e.y,a,300,chaotic?"chaos":false,dmg,chaotic?e.id:null);
 }

 sfx.reflectionVolley();
}

function runBossAttack(e){
 const cycleLen=e.isReflection?4:3;
 e.attackIndex=(e.attackIndex+1)%cycleLen;

 if(e.isReflection&&e.attackIndex===3){
  reflectionMirrorVolley(e,false);
  return;
 }

 if(e.attackIndex===0){
  const hpFrac=e.hp/e.maxHp;
  const count=10+Math.floor((1-hpFrac)*8);

  for(let i=0;i<count;i++){
   bullet(e.x,e.y,i*TAU/count,240,false,1);
  }

  sfx.bossRadial();
 }else if(e.attackIndex===1){
  e.chargeAim=angle(e,P);
  e.chargeState=1;
  e.chargeTimer=.5;
  sfx.bossCharge();
 }else{
  for(let i=0;i<3;i++){
   spawn(choose(["seeker","gunner"]));
  }

  sfx.bossSummon();
 }
}

function updateBoss(e,dt){
 if(e.born>0){
  e.born-=dt;
  return;
 }

 e.age+=dt;
 e.hit=Math.max(0,e.hit-dt);

 const hpFrac=e.hp/e.maxHp;
 const stage=hpFrac<.33?2:hpFrac<.66?1:0;
 const cycle=stage===2?1.6:stage===1?2.1:2.6;

 if(stage>e.enrageStage){
  e.enrageStage=stage;
  sfx.bossEnrage();
  label(e.x,e.y-70,"ENRAGED",e.color,1.2);
 }

 if(e.chargeState===1){
  e.x+=Math.cos(e.chargeAim)*680*dt;
  e.y+=Math.sin(e.chargeAim)*680*dt;
  e.chargeTimer-=dt;
  if(e.chargeTimer<=0)e.chargeState=0;
 }else if(e.tell>0){
  e.tell-=dt;
  if(e.tell<=0)runBossAttack(e);
 }else{
  const a=angle(e,P);
  const n=distance(e,P);
  const speed=n>300?60:0;
  e.x+=Math.cos(a)*speed*dt;
  e.y+=Math.sin(a)*speed*dt;

  e.attackTimer-=dt;
  if(e.attackTimer<=0){
   e.tell=.9;
   e.aim=angle(e,P);
   e.attackTimer=cycle;
   sfx.bossTell();
  }
 }

 e.x=clamp(e.x,e.r+10,W-e.r-10);
 e.y=clamp(e.y,TOP+e.r,BOTTOM-e.r-10);

 if(distance(e,P)<e.r+P.r){
  if(P.dash>0){
   if(!P.hits.has(e.id)){
    P.hits.add(e.id);
    damageEnemy(e,S.dashDamage);
   }
  }else{
   hurt();
  }
 }
}

// An occasional, optional-fight roaming encounter (not a boss-gate fight):
// a chaotic-neutral echo of the player that wanders in, fires at whatever
// is nearest regardless of side, and leaves on its own after a while
// whether or not it's killed. See spawnReflectionFinal for its serious,
// player-only-hostile counterpart at the true end of the run.
function spawnReflection(){
 const edge=choose(["left","right","top"]);
 const pos=
  edge==="left"?{x:-30,y:random(TOP+80,BOTTOM-80)}:
  edge==="right"?{x:W+30,y:random(TOP+80,BOTTOM-80)}:
  {x:random(160,W-160),y:TOP-30};

 const e={
  type:"reflection",shape:"reflection",
  x:pos.x,y:pos.y,r:15,
  hp:220+R.depth*10,maxHp:220+R.depth*10,
  color:C.spectral,
  born:.5,dead:false,id:Math.random(),
  age:0,slow:0,burn:0,hit:0,orbitHit:0,
  fire:1,
  wanderX:random(300,900),wanderY:random(TOP+80,BOTTOM-80),wanderTimer:0,
  life:random(9,13),leaving:false
 };

 enemies.push(e);
 room.reflectionSpawned=true;
 R.lastReflectionDepth=R.depth;
 sfx.reflectionAppear();
 label(e.x,e.y-30,"A REFLECTION STIRS",C.spectral,1.6);
 return e;
}

function updateReflection(e,dt){
 if(e.born>0){
  e.born-=dt;
  return;
 }

 e.age+=dt;
 e.hit=Math.max(0,e.hit-dt);

 if(!e.leaving){
  e.life-=dt;

  if(e.life<=0){
   e.leaving=true;
   sfx.reflectionLeave();
  }
 }

 if(e.leaving){
  const toLeft=e.x,toRight=W-e.x,toTop=e.y-TOP;
  const dir=
   toLeft<toRight&&toLeft<toTop?Math.PI:
   toRight<toTop?0:
   -Math.PI/2;

  e.x+=Math.cos(dir)*260*dt;
  e.y+=Math.sin(dir)*260*dt;

  if(e.x<-60||e.x>W+60||e.y<TOP-60)e.dead=true;
  return;
 }

 e.wanderTimer-=dt;

 if(e.wanderTimer<=0){
  e.wanderX=random(220,W-220);
  e.wanderY=random(TOP+90,BOTTOM-90);
  e.wanderTimer=random(1.4,2.4);
 }

 const a=angle(e,{x:e.wanderX,y:e.wanderY});
 e.x+=Math.cos(a)*120*dt;
 e.y+=Math.sin(a)*120*dt;
 e.x=clamp(e.x,e.r+10,W-e.r-10);
 e.y=clamp(e.y,TOP+e.r,BOTTOM-e.r-10);

 e.fire-=dt;

 if(e.fire<=0){
  reflectionMirrorVolley(e,true);
  e.fire=1.1;
 }

 if(distance(e,P)<e.r+P.r){
  if(P.dash>0){
   if(!P.hits.has(e.id)){
    P.hits.add(e.id);
    damageEnemy(e,S.dashDamage);
   }
  }else{
   hurt();
  }
 }
}

function updateEnemy(e,dt){
 if(e.dead)return;

 if(e.type==="boss"){
  updateBoss(e,dt);
  return;
 }

 if(e.type==="reflection"){
  updateReflection(e,dt);
  return;
 }

 if(e.born>0){
  e.born-=dt;
  return;
 }

 e.age+=dt;
 e.slow=Math.max(0,e.slow-dt);
 e.orbitHit=Math.max(0,e.orbitHit-dt);
 e.hit=Math.max(0,e.hit-dt);

 const a=angle(e,P);
 const n=distance(e,P);
 const speed=e.speed*(1+R.depth*.03)*(e.slow>0?.65:1)*(e.overdrive?2:1);

 if(e.type==="charger"){
  if(e.charge>0){
   e.x+=Math.cos(e.aim)*620*(e.overdrive?2:1)*dt;
   e.y+=Math.sin(e.aim)*620*(e.overdrive?2:1)*dt;
   e.charge-=dt;
  }else if(e.tell>0){
   e.tell-=dt;
   if(e.tell<=0)e.charge=.48;
  }else{
   e.x+=Math.cos(a)*speed*dt;
   e.y+=Math.sin(a)*speed*dt;
   e.fire-=dt;

   if(e.fire<=0){
    e.tell=.9;
    e.aim=a;
    e.fire=2.5;
   }
  }
 }else{
  const ranged=["gunner","sniper","summoner"].includes(e.type);
  const preferred=e.type==="sniper"?450:290;
  const movement=ranged?(n<preferred-65?-.75:n>preferred+45?1:0):1;

  e.x+=Math.cos(a)*speed*movement*dt;
  e.y+=Math.sin(a)*speed*movement*dt;

  if(ranged){
   if(e.tell>0){
    e.tell-=dt;

    // The sniper's telegraph line should track where it's actually about
    // to shoot (recomputed at fire time below), not freeze at the angle
    // from the instant the telegraph started.
    if(e.type==="sniper")e.aim=a;

    if(e.tell<=0){
     if(e.type==="gunner"){
      for(let i=-1;i<=1;i++){
       bullet(e.x,e.y,a+i*.17,265,false,1,null,e.overdrive?2:1);
      }
     }

     if(e.type==="sniper"){
      bullet(e.x,e.y,a,620,false,1,null,e.overdrive?2:1);
     }

     if(e.type==="summoner"){
      spawn("mite",e.x+20,e.y);
      spawn("mite",e.x-20,e.y);
     }

     e.fire=e.type==="sniper"?2.8:2.3;
    }
   }else{
    e.fire-=dt;

    if(e.fire<=0){
     e.tell=e.type==="sniper"?1.3:.8;
     e.aim=a;
    }
   }
  }
 }

 e.x=clamp(e.x,e.r+10,W-e.r-10);
 e.y=clamp(e.y,TOP+e.r,BOTTOM-e.r-10);

 if(distance(e,P)<e.r+P.r){
  if(P.dash>0){
   if(!P.hits.has(e.id)){
    P.hits.add(e.id);
    damageEnemy(e,S.dashDamage);
   }
  }else{
   hurt(e.overdrive?2:1);
  }
 }
}

function updateBullets(dt){
 for(const b of bullets){
  if(b.dead)continue;

  b.px=b.x;
  b.py=b.y;
  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.life-=dt;

  if(
   b.life<=0||
   b.x<-30||b.x>W+30||
   b.y<TOP-30||b.y>BOTTOM+30
  ){
   b.dead=true;
   continue;
  }

  // "chaos" bullets (the roaming Reflection's chaotic-neutral fire) can
  // hit either side; normal bullets stay exclusive to one.
  const hitsEnemies=b.good===true||b.good==="chaos";
  const hitsPlayer=b.good===false||b.good==="chaos";

  if(hitsEnemies){
   for(const e of enemies){
    if(e.dead||e.id===b.ownerId||b.seen.has(e.id))continue;

    if(pointSegment(e.x,e.y,b.px,b.py,b.x,b.y)<e.r+b.r){
     b.seen.add(e.id);
     damageEnemy(e,b.damage);

     if(--b.hits<=0){
      b.dead=true;
      break;
     }
    }
   }
  }

  if(hitsPlayer&&!b.dead&&pointSegment(P.x,P.y,b.px,b.py,b.x,b.y)<P.r+b.r){
   b.dead=true;
   hurt(b.playerDmg);
   if(!P)return;
  }
 }

 bullets=bullets.filter(b=>!b.dead);
}

function pointSegment(px,py,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1;
 const t=clamp(((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1),0,1);
 return Math.hypot(px-x1-dx*t,py-y1-dy*t);
}

const MELTABLE=["seeker","gunner","charger","tank","sniper","summoner","mite"];
const MERGE_TIME=5;

// Punishes kiting a whole wave in a circle instead of thinning it out:
// same-type enemies that stay stacked on each other for MERGE_TIME fuse
// into one "overdrive" body — double damage, double speed, but not more
// total HP than either parent had, so a focused player loses nothing by
// preventing it and an unfocused one trades numbers for a sharper threat.
function updateMerging(dt){
 for(const e of enemies){
  if(e.dead||e.born>0||e.overdrive||!MELTABLE.includes(e.type))continue;

  let partner=null,bestDist=Infinity;

  for(const o of enemies){
   if(o===e||o.dead||o.born>0||o.overdrive||o.type!==e.type)continue;

   const d=distance(e,o);
   if(d<(e.r+o.r)*.55&&d<bestDist){
    bestDist=d;
    partner=o;
   }
  }

  if(partner){
   e.mergeTimer=(e.mergeTimer||0)+dt;

   if(e.mergeTimer>=MERGE_TIME&&!e.dead&&!partner.dead){
    mergeEnemies(e,partner);
   }
  }else{
   e.mergeTimer=Math.max(0,(e.mergeTimer||0)-dt*2);
  }
 }
}

function mergeEnemies(e,partner){
 const mergedHp=Math.max(e.hp,partner.hp);
 const mx=(e.x+partner.x)/2,my=(e.y+partner.y)/2;

 const merged={
  ...e,
  id:Math.random(),
  x:mx,y:my,
  hp:mergedHp,maxHp:mergedHp,
  r:e.r*1.3,
  elite:e.elite||partner.elite,
  born:.4,dead:false,overdrive:true,mergeTimer:0,
  hit:0,orbitHit:0,slow:0,burn:0,age:0,
  tell:0,charge:0,fire:random(.3,.9)
 };

 e.dead=true;
 partner.dead=true;

 enemies.push(merged);
 sfx.overdrive();
 burst(mx,my,C.pink,28,240);
 ring(mx,my,C.pink,60,.5);
 label(mx,my-e.r*1.3-16,"OVERDRIVE",C.pink,1.2);
}

function update(dt){
 if(state!=="playing"||!R||!P||!room)return;

 R.time+=dt;
 room.time+=dt;

 updateHazards(dt);
 if(!P)return;
 updatePlayer(dt);

 if(room.type!=="boss"&&room.time>4&&hazards.filter(h=>h.type==="slow").length<2){
  makeHazard();
 }

 if(room.type==="endless"){
  room.wait-=dt;

  if(
   room.kills<room.target&&
   !room.pending.length&&
   room.wait<=0
  ){
   wave();
   room.wait=1.1;
  }
 }else if(room.type==="boss"){
  if(!room.bossSpawned){
   spawnBoss();
   room.bossSpawned=true;
  }else if(
   isFinalBossRoom()&&
   !room.finalPhase&&
   !enemies.some(e=>e.type==="boss"&&!e.dead)
  ){
   // The act-4 guardian has fallen — the garden's real defense steps in.
   room.finalPhase=true;
   spawnReflectionFinal();
  }
 }else if(!room.pending.length&&!enemies.some(e=>!e.dead)){
  room.wait-=dt;

  if(room.wait<=0&&room.wave<room.maxWaves){
   wave();
   room.wait=1.5;
  }
 }

 let safety=0;

 while(
  room.pending.length&&
  room.pending[0].at<=room.time&&
  enemies.length<48&&
  safety<70
 ){
  const next=room.pending.shift();
  spawn(
   next.type,
   undefined,
   undefined,
   room.type==="elite"&&Math.random()<.28
  );
  safety++;
 }

 for(const e of [...enemies]){
  updateEnemy(e,dt);
  if(!P)return;
 }

 updateMerging(dt);

 updateBullets(dt);
 if(!P)return;

 enemies=enemies.filter(e=>!e.dead);

 for(const o of orbs){
  if(o.dead)continue;

  const n=distance(o,P);

  if(n<125){
   const speed=330;
   o.x+=(P.x-o.x)/Math.max(1,n)*Math.min(speed*dt,n);
   o.y+=(P.y-o.y)/Math.max(1,n)*Math.min(speed*dt,n);
  }

  if(distance(o,P)<20){
   R.xp+=o.value;
   o.dead=true;
  }
 }

 orbs=orbs.filter(o=>!o.dead);

 const complete=room.type==="endless"
  ?room.kills>=room.target&&!room.pending.length&&!enemies.length
  :room.type==="boss"
  ?room.bossSpawned&&!enemies.some(e=>e.type==="boss"&&!e.dead)&&(!isFinalBossRoom()||room.finalPhase)
  :room.wave>=room.maxWaves&&!room.pending.length&&!enemies.length;

 if(complete){
  room.clear+=dt;

  if(room.clear>.8){
   completeRoom();
   return;
  }
 }

 if(R.xp>=xpNeeded()){
  bullets=[];
  levelCheck(hide);
 }
}

function completeRoom(){
 const wasBoss=room.type==="boss";
 const trueVictory=wasBoss&&isFinalBossRoom()&&room.finalPhase;

 if(R.actPicks&&(room.type==="combat"||room.type==="elite"))R.actPicks[R.depth%7]=room.type;
 R.depth++;
 R.score+=room.type==="elite"?900:wasBoss?1500:450;
 R.scrap+=room.type==="elite"?50:wasBoss?100:25;
 sfx.roomClear();

 room=null;
 P=null;
 enemies=[];
 bullets=[];
 hazards=[];
 orbs=[];

 if(trueVictory){
  // The Reflection was the garden's last defense — beating it is the
  // game's one actual win condition (previously unused: finish(true)
  // existed but nothing ever called it).
  finish(true);
 }else if(wasBoss){
  mutationChoice(route,"GUARDIAN FELLED — CHOOSE A <span>REWARD</span>");
 }else{
  route();
 }
}

// Three victory texts off how many mutations were accepted this run
// (weapons never count — see MUTATIONS/WEAPONS above). Same trigger, same
// mechanical win, three very different outcomes.
const ENDING_TIERS=[
 {max:0,title:"THE SLEEPER <span>WAKES</span>",sub:"Nothing was left to hold your place. The garden opens its eyes for the first time in a very long while — and finds itself alone."},
 {max:3,title:"YOU <span>LEAVE</span>",sub:"The gate remembers you enough to let you through. The world outside is loud, and fast, and none of it makes sense anymore. You'll learn. Probably."},
 {max:Infinity,title:"THE GARDEN <span>KEEPS</span> YOU",sub:"You beat your reflection. It doesn't matter. There was never enough of you left to walk through a door."}
];

function finish(win){
 meta.best=Math.max(meta.best,R.score);
 if(win)meta.wins++;

 // Depth-based, not score-based: wave sizes run into the hundreds per
 // room, so score (like scrap before it was rebalanced) inflates far
 // faster than actual progress. Tying meta-currency to depth rewards
 // reaching further, not grinding one room's kill count.
 const sporesEarned=R.depth*10+(win?200:0);
 meta.spores+=sporesEarned;
 write(META,meta);

 stopAmbient();
 win?sfx.victory():sfx.death();

 const picks=R.mutationPicks||0;
 const ending=win?ENDING_TIERS.find(t=>picks<=t.max):null;

 show(
  win?ending.title:"THE GARDEN <span>RECLAIMS YOU</span>",
  win?ending.sub:"The expedition ends. Your memories remain.",
  [],
  [
   {title:"NEW EXPEDITION",fn:frameSelect},
   {title:"TITLE",secondary:true,fn:title}
  ],
  `<div class="stats">
   <div><b>${R.score.toLocaleString()}</b><small>SCORE</small></div>
   <div><b>${R.kills}</b><small>KILLS</small></div>
   <div><b>${R.depth}</b><small>ROOMS</small></div>
   <div><b>${picks}</b><small>MUTATIONS</small></div>
   <div><b>+${sporesEarned}</b><small>SPORES</small></div>
  </div>`
 );

 R=null;
 P=null;
 room=null;
 enemies=[];
 bullets=[];
 hazards=[];
 orbs=[];
}

function burst(x,y,color,count=10,speed=150){
 for(let i=0;i<count;i++){
  const a=random(0,TAU);
  const v=random(speed*.2,speed);
  const life=random(.2,.6);

  particles.push({
   x,y,
   vx:Math.cos(a)*v,
   vy:Math.sin(a)*v,
   life,max:life,
   color,
   size:random(1,4)
  });
 }
}

function label(x,y,text,color=C.white,life=1){
 labels.push({x,y,text,color,life,max:life});
}

function ring(x,y,color,r,life=.4){
 rings.push({x,y,r,color,life,max:life});
}

function circle(x,y,r,color,width=0){
 ctx.beginPath();
 ctx.arc(x,y,r,0,TAU);

 if(width){
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.stroke();
 }else{
  ctx.fillStyle=color;
  ctx.fill();
 }
}

function line(x1,y1,x2,y2,color,width=1){
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.stroke();
}

function polygon(x,y,r,n,a,fill,stroke,width=2){
 ctx.beginPath();

 for(let i=0;i<n;i++){
  const px=x+Math.cos(a+i*TAU/n)*r;
  const py=y+Math.sin(a+i*TAU/n)*r;
  i?ctx.lineTo(px,py):ctx.moveTo(px,py);
 }

 ctx.closePath();

 if(fill){
  ctx.fillStyle=fill;
  ctx.fill();
 }

 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.lineWidth=width;
  ctx.stroke();
 }
}

function text(s,x,y,size=14,color=C.white,align="left"){
 ctx.font=`600 ${size}px monospace`;
 ctx.fillStyle=color;
 ctx.textAlign=align;
 ctx.textBaseline="middle";
 ctx.fillText(s,x,y);
}

function bar(x,y,w,h,value,color){
 ctx.fillStyle="#243344";
 ctx.fillRect(x,y,w,h);
 ctx.fillStyle=color;
 ctx.fillRect(x,y,w*clamp(value,0,1),h);
}

function drawBackground(){
 const biome=BIOMES[Math.min(3,Math.floor((room?.depth||0)/7))];

 ctx.fillStyle=C.bg;
 ctx.fillRect(0,0,W,H);

 const gradient=ctx.createRadialGradient(600,410,30,600,410,650);
 gradient.addColorStop(0,biome.bg);
 gradient.addColorStop(1,C.bg);

 ctx.fillStyle=gradient;
 ctx.fillRect(0,TOP,W,BOTTOM-TOP);

 for(let x=0;x<W;x+=48)line(x,TOP,x,BOTTOM,biome.color+"09");
 for(let y=TOP;y<BOTTOM;y+=48)line(0,y,W,y,biome.color+"09");

 line(20,TOP,W-20,TOP,biome.color+"66");
 line(20,BOTTOM,W-20,BOTTOM,biome.color+"66");
}

function drawHazards(){
  for(const h of hazards){
    if(h.type==="slow"){
      const active=h.age>=h.delay;

      ctx.globalAlpha=active?.28:.1;
      circle(h.x,h.y,h.r,C.pink);

      ctx.globalAlpha=.9;
      circle(h.x,h.y,h.r,C.pink,2);

      text(
        active?"SLOW":"WARNING",
        h.x,h.y,12,C.pink,"center"
      );
    }

    if(h.type==="blast"){
      const charging=h.age<h.delay;
      const progress=clamp(h.age/h.delay,0,1);

      ctx.save();

      if(charging){
        // Warning circle contracts and pulses before impact.
        const pulse=.5+.5*Math.sin(visual*12);
        ctx.globalAlpha=.12+.1*pulse;
        circle(h.x,h.y,h.r*(1.15-progress*.2),C.gold);

        ctx.globalAlpha=.9;
        circle(h.x,h.y,h.r*(1.2-progress*.2),C.gold,2);

        ctx.globalAlpha=.8;
        text("MOVE",h.x,h.y,13,C.gold,"center");
      }else{
        // Brief expanding blast animation.
        const blastProgress=clamp(
          (h.age-h.delay)/Math.max(.01,h.duration),
          0,1
        );

        ctx.globalAlpha=.24*(1-blastProgress);
        circle(
          h.x,
          h.y,
          h.r*(1+blastProgress*.75),
          C.gold
        );

        ctx.globalAlpha=.95*(1-blastProgress);
        circle(
          h.x,
          h.y,
          h.r*(1+blastProgress*.75),
          C.gold,
          4
        );

        ctx.globalAlpha=.8;
        circle(h.x,h.y,h.r*.35,C.white);
      }

      ctx.restore();
    }
  }

  ctx.globalAlpha=1;
}

function drawBoss(e){
  if(e.born>0){
    ctx.globalAlpha=.65;
    circle(e.x,e.y,e.r+e.born*40,e.color,3);
    ctx.globalAlpha=1;
    return;
  }

  if(e.tell>0||e.chargeState===1){
    ctx.save();
    ctx.globalAlpha=.6;
    ctx.setLineDash([8,9]);
    circle(e.x,e.y,e.r+26,e.color,3);
    ctx.restore();
  }

  if(e.isReflection){
    const facing=angle(e,P);

    for(let i=3;i>0;i--){
      ctx.globalAlpha=.09*i;
      drawArrow(e.x-Math.cos(facing)*i*13,e.y-Math.sin(facing)*i*13,facing,e.color,1.7);
    }

    ctx.globalAlpha=1;
    drawArrow(e.x,e.y,facing,e.hit>0?C.white:e.color,1.9);
  }else{
    const fill=e.hit>0?C.white:"#1a1030";
    polygon(e.x,e.y,e.r,7,e.age*.3,fill,e.color,5);
  }

  text(e.name,e.x,e.y-e.r-22,13,e.color,"center");
}

function drawReflection(e){
  if(e.dead)return;

  if(e.born>0){
    ctx.globalAlpha=.6;
    circle(e.x,e.y,e.r+e.born*30,C.spectral,2);
    ctx.globalAlpha=1;
    return;
  }

  const facing=angle(e,P);

  for(let i=2;i>0;i--){
    ctx.globalAlpha=.1*i;
    drawArrow(e.x-Math.cos(facing)*i*10,e.y-Math.sin(facing)*i*10,facing,C.spectral,.85);
  }

  ctx.globalAlpha=(!e.leaving&&e.life<2)?.5+Math.abs(Math.sin(e.age*14))*.4:1;
  drawArrow(e.x,e.y,facing,e.hit>0?C.white:C.spectral,.95);
  ctx.globalAlpha=1;

  if(e.hp<e.maxHp){
    bar(e.x-24,e.y-e.r-18,48,4,Math.max(0,e.hp/e.maxHp),C.spectral);
  }
}

function drawEnemy(e){
  if(e.dead)return;

  if(e.type==="boss"){
    drawBoss(e);
    return;
  }

  if(e.type==="reflection"){
    drawReflection(e);
    return;
  }

  if(e.born>0){
    ctx.globalAlpha=.65;
    circle(e.x,e.y,e.r+e.born*30,e.color,2);
    ctx.globalAlpha=1;
    return;
  }

  if(e.tell>0){
    ctx.save();
    ctx.globalAlpha=.6;
    ctx.setLineDash([8,9]);

    if(e.type==="charger"||e.type==="sniper"){
      line(
        e.x,e.y,
        e.x+Math.cos(e.aim)*1000,
        e.y+Math.sin(e.aim)*1000,
        e.color,
        e.type==="charger"?12:2
      );
    }else{
      circle(e.x,e.y,e.r+18,e.color,2);
    }

    ctx.restore();
  }

  if(e.overdrive){
    ctx.save();
    ctx.globalAlpha=.5+Math.sin(e.age*9)*.3;
    circle(e.x,e.y,e.r+9,C.pink,3);
    ctx.restore();
  }

  const fill=e.hit>0?C.white:"#132330";

  if(e.shape==="triangle"){
    polygon(
      e.x,e.y,e.r,3,angle(e,P),
      fill,e.color,e.elite||e.overdrive?4:2
    );
  }else if(e.shape==="square"){
    polygon(
      e.x,e.y,e.r,4,
      Math.PI/4+e.phase,
      fill,e.color,e.elite||e.overdrive?4:2
    );
  }else if(e.shape==="diamond"){
    polygon(
      e.x,e.y,e.r,4,angle(e,P),
      fill,e.color,e.elite||e.overdrive?4:2
    );
  }else if(e.shape==="hex"){
    polygon(
      e.x,e.y,e.r,6,e.phase,
      fill,e.color,e.elite||e.overdrive?4:2
    );
  }else if(e.shape==="star"){
    ctx.beginPath();

    for(let i=0;i<10;i++){
      const radius=i%2?e.r*.45:e.r;
      const a=-Math.PI/2+i*Math.PI/5;
      const px=e.x+Math.cos(a)*radius;
      const py=e.y+Math.sin(a)*radius;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }

    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.strokeStyle=e.color;
    ctx.lineWidth=e.elite||e.overdrive?4:2;
    ctx.stroke();
  }else if(e.shape==="ring"){
    circle(e.x,e.y,e.r,fill,e.elite||e.overdrive?4:2);
    circle(e.x,e.y,e.r*.45,e.color,2);
  }else{
    circle(e.x,e.y,e.r,fill,e.elite||e.overdrive?4:2);
  }

  if(e.type==="charger"){
    text("!",e.x,e.y,15,e.color,"center");
  }

  if(e.type==="sniper"){
    line(
      e.x,e.y,
      e.x+Math.cos(angle(e,P))*25,
      e.y+Math.sin(angle(e,P))*25,
      e.color,
      3
    );
  }

  drawHealthShards(e);
}

function drawHealthShards(e){
 const total=Math.max(3,Math.ceil(e.maxHp/45));
 const current=Math.max(0,Math.ceil(e.hp/Math.max(1,e.maxHp)*total));
 const gap=5;
 const width=total*7+(total-1)*gap;
 const start=e.x-width/2;

 for(let i=0;i<total;i++){
  const x=start+i*(7+gap);
  const active=i<current;
  polygon(
   x+3.5,
   e.y-e.r-14,
   5,
   4,
   Math.PI/4,
   active?e.color:"#263849",
   active?C.white:"#263849",
   .7
  );
 }
}


function drawPlayer(){
  if(!P)return;

  if(P.dash>0){
    for(let i=4;i>0;i--){
      ctx.globalAlpha=.08*(5-i);
      drawArrow(
        P.x-P.dx*i*18,
        P.y-P.dy*i*18,
        P.angle,
        C.mint,
        .8
      );
    }

    ctx.globalAlpha=1;
    circle(P.x,P.y,34,C.mint,2);
  }

  if(P.inv>0&&Math.floor(visual*18)%2===0){
    ctx.globalAlpha=.45;
  }

  drawArrow(P.x,P.y,P.angle,C.mint,1);

  ctx.globalAlpha=1;

  if(P.energy>=S.pulseCost){
    ctx.setLineDash([5,8]);
    circle(P.x,P.y,31,C.gold,2);
    ctx.setLineDash([]);
  }
}

function drawArrow(x,y,rotation,color,scale=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rotation);
  ctx.scale(scale,scale);

  ctx.beginPath();
  ctx.moveTo(23,0);
  ctx.lineTo(-13,-13);
  ctx.lineTo(-7,0);
  ctx.lineTo(-13,13);
  ctx.closePath();

  ctx.fillStyle="#122835";
  ctx.fill();
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(2,0,3.5,0,TAU);
  ctx.fillStyle=C.white;
  ctx.fill();

  ctx.restore();
}

function drawPlayerShards(){
  if(!R||!S)return;

  const shardSize=9;
  const gap=7;
  const total=S.maxHp;
  const width=total*shardSize+(total-1)*gap;
  const start=600-width/2;

  for(let i=0;i<total;i++){
    const x=start+i*(shardSize+gap);
    const active=i<R.hp;

    polygon(
      x+shardSize/2,
      51,
      shardSize*.72,
      4,
      Math.PI/4,
      active?C.mint:"#263849",
      active?C.white:"#263849",
      .8
    );
  }
}

function drawHUD(){
 ctx.fillStyle="#09111ef2";
 ctx.fillRect(0,0,W,TOP);
 ctx.fillRect(0,BOTTOM,W,H-BOTTOM);

 text("VOID BLOOM / ECHOES",24,25,19,C.mint);

 if(!R)return;

 text(`${R.scrap} SCRAP · ${R.score} SCORE`,24,55,12,C.gold);
 text(`LEVEL ${R.level}`,24,81,11,C.mint);
 bar(90,78,220,5,R.xp/xpNeeded(),C.mint);

 text("INTEGRITY",600,25,11,C.muted,"center");
drawPlayerShards();
 text(`ROOM ${R.depth+1} · KILLS ${R.kills}`,W-24,27,14,C.white,"right");

 if(room){
  const objective=room.type==="endless"
   ?`ENDLESS ${room.kills}/${room.target}`
   :room.type==="boss"
   ?"GUARDIAN"
   :`WAVE ${room.wave}/${room.maxWaves}`;

  text(objective,W-24,55,11,C.pink,"right");
 }

 if(room&&room.type==="boss"){
  const boss=enemies.find(e=>e.type==="boss");

  if(boss){
   text(boss.name,600,90,13,boss.color,"center");
   bar(350,98,500,8,boss.hp/boss.maxHp,boss.color);
  }
 }

 drawUpgradeBar();

 if(P){
  if(isTouch){
   // The touch buttons show their own recharge state (a conic-gradient
   // ring) instead of duplicating it in a separate canvas bar.
   const dashReady=P.dashCD<=0;
   const pulseReady=P.energy>=S.pulseCost;

   btnDash.style.setProperty("--ready",dashReady?1:1-P.dashCD/S.dashCD);
   btnDash.classList.toggle("ready",dashReady);
   btnPulse.style.setProperty("--ready",Math.min(1,P.energy/S.pulseCost));
   btnPulse.classList.toggle("ready",pulseReady);
  }else{
   text("[SPACE] DASH",24,H-48,12,P.dashCD<=0?C.mint:C.muted);

   bar(24,H-28,195,6,1-P.dashCD/S.dashCD,C.mint);

   text(
     P.dashCD<=0?"READY":P.dashCD.toFixed(1)+"s",
     230,
     H-26,
     10,
     C.mint
   );

   text("[E] PULSE",330,H-48,12,P.energy>=S.pulseCost?C.gold:C.muted);

   bar(330,H-28,195,6,P.energy/S.pulseCost,C.gold);

   text(
     P.energy>=S.pulseCost
       ?"READY"
       :Math.floor(P.energy/S.pulseCost*100)+"%",
     535,
     H-26,
     10,
     C.gold
   );
  }
 }
}

// A compact row of owned mutations/weapons and their current rank, along
// the bottom HUD strip — a glance at your build without opening BUILD.
function drawUpgradeBar(){
 if(!R)return;

 const owned=[
  ...MUTATIONS.filter(m=>rank(m.id)>0).map(m=>({label:`${m.name.split(" ")[0]} ${rank(m.id)}`,color:C.mint})),
  ...WEAPONS.filter(w=>weaponRank(w.id)>0).map(w=>({label:`${w.name.split(" ")[0]} ${weaponRank(w.id)}`,color:C.gold}))
 ];

 if(!owned.length)return;

 ctx.font="600 11px monospace";

 const gap=14,y=740,maxX=W-24;
 let x=24,shown=0;

 for(;shown<owned.length;shown++){
  const w=ctx.measureText(owned[shown].label).width;
  if(x+w>maxX-40)break;
  text(owned[shown].label,x,y,11,owned[shown].color,"left");
  x+=w+gap;
 }

 if(shown<owned.length){
  text(`+${owned.length-shown}`,x,y,11,C.muted,"left");
 }
}

function draw(){
 ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
 drawBackground();

 ctx.save();
 ctx.beginPath();
 ctx.rect(0,TOP,W,BOTTOM-TOP);
 ctx.clip();

 if(shake>0)ctx.translate(random(-shake,shake),random(-shake,shake));

 drawHazards();

 for(const o of orbs)circle(o.x,o.y,4,C.mint);
 for(const e of enemies)drawEnemy(e);

 for(const b of bullets){
  if(!b.dead)circle(b.x,b.y,b.r,b.good?C.mint:C.gold);
 }

 drawPlayer();

 for(const p of particles){
  ctx.globalAlpha=p.life/p.max;
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,p.size,p.size);
 }
 ctx.globalAlpha=1;

 for(const r of rings){
  ctx.globalAlpha=r.life/r.max;
  circle(r.x,r.y,r.r*(1-r.life/r.max),r.color,2);
 }
 ctx.globalAlpha=1;

 for(const l of labels){
  ctx.globalAlpha=Math.min(1,l.life*2);
  text(l.text,l.x,l.y,l.max>2?25:13,l.color,"center");
 }
 ctx.globalAlpha=1;

 for(const b of beams){
  ctx.globalAlpha=b.life/b.max;
  line(b.x1,b.y1,b.x2,b.y2,b.color,3);
 }
 ctx.globalAlpha=1;

 drawWeapons();

 ctx.restore();
 drawHUD();
}

function drawWeapons(){
 if(!P)return;

 const haloCount=weaponRank("halo");

 for(let i=0;i<haloCount;i++){
  const a=P.orbit+i*TAU/haloCount;
  circle(P.x+Math.cos(a)*68,P.y+Math.sin(a)*68,9,C.violet,2);
 }
}

function effects(dt){
 shake=Math.max(0,shake-dt*25);

 for(const p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vx*=.96;
  p.vy*=.96;
  p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);

 rings.forEach(r=>r.life-=dt);
 rings=rings.filter(r=>r.life>0);

 labels.forEach(l=>{
  l.life-=dt;
  l.y-=dt*18;
 });
 labels=labels.filter(l=>l.life>0);

 beams.forEach(b=>b.life-=dt);
 beams=beams.filter(b=>b.life>0);
}

function dash(){
 if(state!=="playing"||!P||P.dashCD>0)return;

 let x=+(keys.has("d")||keys.has("arrowright"))-
  +(keys.has("a")||keys.has("arrowleft"));

 let y=+(keys.has("s")||keys.has("arrowdown"))-
  +(keys.has("w")||keys.has("arrowup"));

 const n=Math.hypot(x,y)||1;

 P.dx=x/n||P.dx;
 P.dy=y/n||P.dy;
 P.dash=.17;
 P.dashCD=S.dashCD;
 P.hits.clear();
 wakeAudio();
 sfx.dash();
}

function pulse(){
 if(state!=="playing"||!P||P.energy<S.pulseCost)return;

 P.energy=0;
 wakeAudio();
 sfx.pulse();

 for(const b of bullets){
  if(!b.good)b.dead=true;
 }

 for(const e of enemies){
  if(!e.dead&&distance(e,P)<500){
   damageEnemy(e,S.pulseDamage);
  }
 }

 label(P.x,P.y-45,"PULSE",C.gold,.8);
}

function pause(){
 if(state!=="playing")return;

 sfx.pause();
 show("TAKE <span>ROOT</span>",
  "The room is paused. Your cooldowns do not refill while paused.",
  [],
  [
   {title:"RESUME",fn:hide},
   {title:"BUILD",secondary:true,fn:build},
   {title:muted?"SOUND: OFF":"SOUND: ON",secondary:true,fn:()=>{toggleMute();pause();}},
   {title:"ABANDON",secondary:true,fn:()=>finish(false)}
  ]);
}

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();

 if(e.target instanceof HTMLInputElement)return;
 if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k))e.preventDefault();
 if(e.repeat)return;

 keys.add(k);

 if(state==="playing"){
  if(k===" ")dash();
  if(k==="e")pulse();
  if(k==="p"||k==="escape")pause();
 }else if(state==="dying"){
  // Let the death flash play out — no menu escape mid-echo.
 }else if(/^[1-9]$/.test(k)){
  invoke(Number(k)-1);
 }else if(k==="escape"){
  title();
 }
});

addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
addEventListener("blur",()=>keys.clear());

function frame(now){
 const dt=Math.min((now-last)/1000,.05);
 last=now;
 visual+=dt;

 if(state==="playing"){
  accumulator+=dt;

  let steps=0;
  while(accumulator>=1/120&&steps<6&&state==="playing"){
   update(1/120);
   accumulator-=1/120;
   steps++;
  }

  if(steps>=6)accumulator=0;
 }

 effects(dt);
 draw();
 requestAnimationFrame(frame);
}

title();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
