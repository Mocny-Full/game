<style>
:root{
  color-scheme:dark;
  --mint:#71ffd0;--gold:#ffcf78;--pink:#ff7197;
  --blue:#79ceff;--violet:#bda2ff;--ink:#e8f4ff;--muted:#96aabd;
  --barL:0px;--barR:0px;--stageTop:0px;--stageBottom:0px;--stageW:100vw;--stageH:100dvh
}
*{box-sizing:border-box}
html,body{margin:0;background:#03060a;color:var(--ink);font-family:system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden;touch-action:none;overscroll-behavior:none}
#stage{position:relative;width:min(1200px,100vw,calc(100dvh * 3 / 2));aspect-ratio:3/2;background:#080e18;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4%;overflow:auto;background:#040914e8;backdrop-filter:blur(8px);touch-action:auto;z-index:5}
#overlay.hidden{display:none}
/* Stacks as normal flow inside a single fixed column so #rotateHint and
   #a2hsHint (below) never need to know about each other's height. The
   safe-area inset lives on the shared container so whichever hint ends up
   visually first still clears the notch/status bar. */
#hintStack{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px)}
#rotateHint{padding:6px 10px;background:#12242bcc;color:var(--gold);font:600 11px monospace;text-align:center;display:none}
@media(orientation:portrait) and (pointer:coarse){
 #rotateHint{display:block}
}
/* iPhone Safari has no Fullscreen API for regular page content (only
   iPadOS and Android do), so requestFullscreen() silently no-ops there.
   The only genuine fullscreen/no-chrome experience on iPhone is launching
   from a Home Screen icon (already supported via the apple-mobile-web-app
   meta tags above) — this banner is the fallback nudge toward that, shown
   only when the real API is unavailable. */
#a2hsHint{position:relative;display:none;padding:6px 34px 6px 10px;
 background:#1a1428cc;color:var(--violet);font:600 11px monospace;text-align:center}
#a2hsHint.show{display:block}
#a2hsHint button{position:absolute;top:2px;right:6px;
 width:22px;height:22px;border:1px solid var(--violet);background:transparent;color:var(--violet);
 font:700 12px monospace;line-height:1;border-radius:50%;cursor:pointer;padding:0}
/* #touch spans the full viewport (not just #stage) so controls can live in
   the letterbox bars beside the stage instead of covering the play field. */
#touch{position:fixed;inset:0;display:none;touch-action:none;z-index:4;pointer-events:none}
#touch.active{display:block}
/* The joystick can start from a touch anywhere on screen — it only ever
   covers the play field's dead space anyway, and pinning it to the bar
   turned out to be more of a hindrance than a help. Buttons sit later in
   the DOM so they still intercept their own taps first. */
#joyZone{position:fixed;inset:0;pointer-events:auto;touch-action:none}
#joyBase{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border:2px solid var(--mint);border-radius:50%;background:#0c1422b3;opacity:0;transition:opacity .12s;pointer-events:none}
#joyBase.show{opacity:.9}
#joyKnob{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--mint);opacity:.9;pointer-events:none}
.tbtn{position:fixed;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 11px monospace;color:#08251e;background:var(--mint);opacity:.82;user-select:none;-webkit-user-select:none;touch-action:none;border:none;--ready:1}
.tbtn:active{opacity:1;transform:scale(.94)}
.tbtn.ready{box-shadow:0 0 14px 3px #ffffffb0}
/* A conic-gradient "pie" overlay shows recharge progress directly on the
   button instead of a separate HUD bar — the dark wedge shrinks to
   nothing as --ready goes from 0 to 1. */
.tbtn::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
 background:conic-gradient(transparent calc(var(--ready) * 360deg),#00000080 0)}
#btnDash{width:76px;height:76px;right:calc(var(--barR) + 104px);bottom:calc(var(--stageBottom) + 26px)}
#btnPulse{width:76px;height:76px;right:calc(var(--barR) + 20px);bottom:calc(var(--stageBottom) + 26px);background:var(--gold)}
#btnPause{width:42px;height:42px;right:calc(var(--barR) + 16px);top:calc(var(--stageTop) + 16px + env(safe-area-inset-top,0px));background:#12242bcc;color:var(--mint);border:1px solid var(--mint);font-size:9px}
#touch.bars #btnDash{right:calc((var(--barR) - 76px)/2 + env(safe-area-inset-right,0px));bottom:calc(var(--stageBottom) + 116px)}
#touch.bars #btnPulse{right:calc((var(--barR) - 76px)/2 + env(safe-area-inset-right,0px));bottom:calc(var(--stageBottom) + 26px)}
#touch.bars #btnPause{right:calc((var(--barR) - 42px)/2 + env(safe-area-inset-right,0px))}
@media(max-width:700px){
 #btnDash{width:62px;height:62px;right:calc(var(--barR) + 82px);bottom:calc(var(--stageBottom) + 14px)}
 #btnPulse{width:62px;height:62px;right:calc(var(--barR) + 14px);bottom:calc(var(--stageBottom) + 14px)}
 #touch.bars #btnDash{right:calc((var(--barR) - 62px)/2 + env(safe-area-inset-right,0px));bottom:calc(var(--stageBottom) + 86px)}
 #touch.bars #btnPulse{right:calc((var(--barR) - 62px)/2 + env(safe-area-inset-right,0px));bottom:calc(var(--stageBottom) + 14px)}
}
.panel{width:min(1000px,100%);text-align:center}
.eyebrow{color:var(--mint);font:700 12px monospace;letter-spacing:.2em}
h1{font-size:clamp(30px,6vw,72px);line-height:1;margin:14px 0;letter-spacing:-.06em}

.button{padding:12px 21px;border:1px solid var(--mint);background:var(--mint);color:#08251e;font:800 12px monospace}
.button.secondary{background:#12242b;color:var(--mint);border-color:#35594f}

.badge{display:inline-block;padding:5px 9px;margin:3px;background:#243727;color:var(--gold);font:11px monospace}
.pathmap{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;margin:18px 0 -4px}
.pn{display:flex;gap:2px;padding:3px;border:1px solid #223140;border-radius:4px;background:#0c1422a0}
.pn.now{border-color:var(--mint)}

.pn.done .pn-opt.picked{opacity:1}

.pn.now .pn-opt{opacity:.9}
.pn.boss{margin-left:3px}
.pn-opt{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 8px monospace;border:1px solid var(--c);color:var(--c);background:transparent}
.pn-opt.picked{background:var(--c);color:#04121b}

@media(max-width:700px){

 .card h3{font-size:14px}.card p{font-size:10px}.sub{font-size:11px}
 .button{padding:9px 12px;font-size:10px}
 .pathmap{margin:12px 0 -2px}
 .pn-opt{width:12px;height:12px;font-size:7px}
 .pn.boss .pn-opt{width:15px;height:15px;font-size:8px}
}
/* Short landscape viewports (phones in the recommended orientation) don't
   have room for the room-choice/mutation panel at full size — it must fit
   without scrolling, since the cards are the primary action. */
@media(max-height:520px) and (pointer:coarse){
 #overlay{padding:1.5% 4%}
 .eyebrow{font-size:9px}
 h1{font-size:19px;margin:4px 0}
 .sub{font-size:10px;line-height:1.35;margin:4px auto}
 .small{font-size:9px;line-height:1.4;margin:4px 0}
 .pathmap{margin:6px 0 0}
 .pn-opt{width:11px;height:11px;font-size:7px}
 .pn.boss .pn-opt{width:14px;height:14px;font-size:8px}
 .cards{gap:6px;margin:6px 0}
 .card{min-height:0;padding:7px 9px}
 .card em{font-size:8px}
 .card h3{font-size:11px;margin:3px 0 2px}
 .card p{font-size:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .card p.lore{display:none}
 .card small{font-size:8px;margin-top:3px}
 .buttons{margin-top:6px;gap:6px}
 .button{padding:5px 10px;font-size:9px}
 .stats{margin:8px 0;gap:14px}
 .stats b{font-size:16px}
}

<div id="rotateHint">ROTATE TO LANDSCAPE FOR THE BEST EXPERIENCE</div>
<div id="a2hsHint"><span id="a2hsText"></span><button type="button" id="a2hsClose">×</button></div>
</div>

<canvas id="game"></canvas>
<div id="overlay"></div>
</div>
<div id="touch">
 <div id="joyZone"></div>
 <div id="joyBase"></div>
 <div id="joyKnob"></div>
 <button type="button" id="btnDash" class="tbtn">DASH</button>
 <button type="button" id="btnPulse" class="tbtn">PULSE</button>
 <button type="button" id="btnPause" class="tbtn">II</button>
</div>

<script>
"use strict";
(()=>{
const W=1200,H=800,TOP=100,BOTTOM=724,TAU=Math.PI*2;
const C={
 mint:"#71ffd0",gold:"#ffcf78",pink:"#ff7197",blue:"#79ceff",
 violet:"#bda2ff",white:"#e8f4ff",muted:"#96aabd",bg:"#080e18",
 spectral:"#d9e4ff"
};

const canvas=document.querySelector("#game");
const ctx=canvas.getContext("2d");
const overlay=document.querySelector("#overlay");
const keys=new Set();

const isTouch=matchMedia("(pointer:coarse)").matches;
const touchUI=document.querySelector("#touch");

// Ask for fullscreen on every menu tap so the mobile browser's address bar
// gets out of the way. Must run from a user gesture, so it's called from
// invoke() rather than on load. Deliberately retries every time rather than
// giving up after the first exit — fullscreen can drop for reasons that
// have nothing to do with the player choosing to leave it (an OS dialog,
// pulling down the notification shade, rotating the device), and there's
// no reliable way to tell that apart from a deliberate exit. Since this
// only ever fires from a real tap, and is a no-op whenever already
// fullscreen, retrying costs nothing and fixes the case where the player
// gets kicked out and is then stuck without fullscreen for the rest of
// the session.
//
// iPhone Safari has no Fullscreen API for ordinary page content at all
// (requestFullscreen/webkitRequestFullscreen are both undefined there —
// iPadOS and Android support it fine), so this silently does nothing on
// an iPhone in a regular browser tab. The only genuine chrome-free
// experience on iPhone is launching from a Home Screen icon, which the
// apple-mobile-web-app meta tags above already support — see the
// a2hsHint banner below for the fallback nudge toward that.
const hasFullscreenAPI=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const isStandalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
function enterFullscreen(){
 // Must check both the standard and the webkit-prefixed property — some
 // Android browsers/WebViews only ever populate webkitFullscreenElement,
 // never the unprefixed one. Checking only fullscreenElement there means
 // this always thinks it's not fullscreen, even while it already is, and
 // calls webkitRequestFullscreen() again on every single menu tap. Calling
 // it while already (webkit-)fullscreen is what actually froze the page —
 // not a lag, a wedged renderer requiring a reload.
 if(!isTouch||document.fullscreenElement||document.webkitFullscreenElement)return;
 const el=document.documentElement;
 const req=el.requestFullscreen||el.webkitRequestFullscreen;
 if(req)req.call(el).catch(()=>{});
}

// Nudge iPhone Safari users (the one case with no real fullscreen option)
// toward Add to Home Screen instead. Dismissed once, remembered forever —
// read/write/t/UI are all defined further down, but this only ever runs
// from maybeShowA2hsHint() below, called after the whole script has run.
const a2hsHint=document.querySelector("#a2hsHint");
const a2hsText=document.querySelector("#a2hsText");
const A2HS_DISMISSED_KEY="void-bloom-a2hs-dismissed";
function maybeShowA2hsHint(){
 if(!isTouch||isStandalone||hasFullscreenAPI||read(A2HS_DISMISSED_KEY,false))return;
 a2hsText.textContent=t("a2hs_hint");
 a2hsHint.classList.add("show");
}
document.querySelector("#a2hsClose").addEventListener("click",()=>{
 a2hsHint.classList.remove("show");
 write(A2HS_DISMISSED_KEY,true);
});

const joyZone=document.querySelector("#joyZone");
const joyBase=document.querySelector("#joyBase");
const joyKnob=document.querySelector("#joyKnob");
const btnDash=document.querySelector("#btnDash");
const btnPulse=document.querySelector("#btnPulse");
const btnPause=document.querySelector("#btnPause");

const touchMove={x:0,y:0};
let joyId=null,joyOrigin={x:0,y:0};
const JOY_RADIUS=52;

function setJoy(clientX,clientY,originX,originY){
 // #touch now spans the full viewport, so client coordinates map directly.
 joyBase.style.left=originX+"px";
 joyBase.style.top=originY+"px";
 joyKnob.style.left=clientX+"px";
 joyKnob.style.top=clientY+"px";
}

joyZone.addEventListener("pointerdown",e=>{
 if(joyId!==null)return;
 joyId=e.pointerId;
 joyZone.setPointerCapture(joyId);
 joyOrigin={x:e.clientX,y:e.clientY};
 setJoy(e.clientX,e.clientY,e.clientX,e.clientY);
 joyBase.classList.add("show");
});

joyZone.addEventListener("pointermove",e=>{
 if(e.pointerId!==joyId)return;
 let dx=e.clientX-joyOrigin.x;
 let dy=e.clientY-joyOrigin.y;
 const len=Math.hypot(dx,dy);
 if(len>JOY_RADIUS){dx=dx/len*JOY_RADIUS;dy=dy/len*JOY_RADIUS;}
 setJoy(joyOrigin.x+dx,joyOrigin.y+dy,joyOrigin.x,joyOrigin.y);
 touchMove.x=dx/JOY_RADIUS;
 touchMove.y=dy/JOY_RADIUS;
});

function joyRelease(e){
 if(e.pointerId!==joyId)return;
 joyId=null;
 touchMove.x=0;
 touchMove.y=0;
 joyBase.classList.remove("show");
}
joyZone.addEventListener("pointerup",joyRelease);
joyZone.addEventListener("pointercancel",joyRelease);

function tapButton(el,fn){
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  fn();
 });
}
tapButton(btnDash,()=>dash());
tapButton(btnPulse,()=>pulse());
tapButton(btnPause,()=>pause());

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const random=(a,b)=>a+Math.random()*(b-a);
const choose=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{
 const r=a.slice();
 for(let i=r.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [r[i],r[j]]=[r[j],r[i]];
 }
 return r;
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

const MASTER_VOLUME=.35;
let muted=read("void-bloom-muted",false);
let lang=read("void-bloom-lang","en");
function setLang(l){
 lang=l;
 write("void-bloom-lang",l);
 // The a2hs hint lives outside the show()-driven overlay system, so it
 // needs its own refresh when the language changes while it's visible.
 if(a2hsHint&&a2hsHint.classList.contains("show"))a2hsText.textContent=t("a2hs_hint");
}
// t(key) looks up a short structural UI string; content data (mutations,
// bosses, notes, etc.) carries its own per-language fields instead, merged
// in by localize() below, since those need id/max/etc. left untouched.
function t(key){
 return (UI[lang]&&UI[lang][key])??UI.en[key]??key;
}
// Overlays a content object's `<field>_pl` translations onto its base
// (English) fields when Polish is active, leaving id/max/tag-free fields
// like rank numbers untouched. Falls back to English for any field a
// translation hasn't filled in.
function localize(item){
 if(lang!=="pl"||!item)return item;

 const out={...item};
 for(const k of Object.keys(item)){
  if(k.endsWith("_pl"))continue;
  if(item[k+"_pl"]!==undefined)out[k]=item[k+"_pl"];
 }
 return out;
}

 en:{
  new_expedition:"NEW EXPEDITION",the_garden:"THE GARDEN",how_to_play:"HOW TO PLAY",

  title_sub:"The garden has learned to punish hesitation.<br><b>Dash and pulse are emergency tools, not permanent movement abilities.</b>",
  best_label:"BEST",victories_label:"VICTORIES",spores_label:"SPORES",
  touch_hint:"LEFT SIDE JOYSTICK MOVES · DASH / PULSE BUTTONS",
  keyboard_hint:"SPACE DASH · E PULSE · WASD / ARROWS MOVE",
  back:"BACK",continue_btn:"CONTINUE",leave:"LEAVE",

  tend_garden_sub:"Spend spores on permanent upgrades. Every future expedition starts with whatever is unlocked here.",
  maxed:"MAXED",rank_label:"RANK",spores_footer:"SPORES",
  danger_title:"READ THE <span>DANGER</span>",
  danger_sub:"Every enemy has a distinct silhouette and a visible health-shard bar. Chargers telegraph their rush. Snipers draw a firing line. Pink fields slow movement by 65% while you stand inside them.<br><br>Dash cooldowns are long and pulse energy is scarce. Do not spend either ability simply to move faster.",
  dash_title:"DASH",dash_tag_touch:"BUTTON",dash_tag_key:"SPACE",
  dash_desc:"A short emergency dash. Damages enemies crossed and grants invulnerability.",
  dash_foot:"Cooldown: roughly 2.3–3.3 seconds.",

  enemies_title:"ENEMIES",enemies_tag:"READ",

  enemies_foot:"Health shards show remaining HP.",
  pathmap_title:"PATH MAP",pathmap_tag:"READ",
  pathmap_desc:"The row above your choices previews the whole floor. Filled icons are rooms you've resolved; outlined icons are still open.",

let audioCtx=null,masterGain=null,noiseBuffer=null,ambientNodes=null;

function ensureAudio(){
 if(audioCtx)return audioCtx;

 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=muted?0:MASTER_VOLUME;
  masterGain.connect(audioCtx.destination);
 }catch{
  audioCtx=false;
 }

 return audioCtx;
}

function wakeAudio(){
 const ctx=ensureAudio();
 if(ctx&&ctx.state==="suspended")ctx.resume();
}

function toggleMute(){
 muted=!muted;
 write("void-bloom-muted",muted);
 if(masterGain)masterGain.gain.value=muted?0:MASTER_VOLUME;
}

function tone(freq,duration,type="sine",vol=1,freqEnd=null,startDelay=0){
 const ctx=ensureAudio();
 if(!ctx)return;

 const t0=ctx.currentTime+startDelay;
 const osc=ctx.createOscillator();
 const gain=ctx.createGain();

 osc.type=type;
 osc.frequency.setValueAtTime(freq,t0);
 if(freqEnd)osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd),t0+duration);

 gain.gain.setValueAtTime(vol,t0);
 gain.gain.exponentialRampToValueAtTime(.001,t0+duration);

 osc.connect(gain);
 gain.connect(masterGain);
 osc.start(t0);
 osc.stop(t0+duration);
}

function getNoiseBuffer(ctx){
 if(!noiseBuffer){
  noiseBuffer=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const data=noiseBuffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
 }
 return noiseBuffer;
}

function noiseBurst(duration,vol=1,filterFreq=1000,filterType="lowpass"){
 const ctx=ensureAudio();
 if(!ctx)return;

 const t0=ctx.currentTime;
 const src=ctx.createBufferSource();
 const filter=ctx.createBiquadFilter();
 const gain=ctx.createGain();

 src.buffer=getNoiseBuffer(ctx);
 filter.type=filterType;
 filter.frequency.value=filterFreq;

 gain.gain.setValueAtTime(vol,t0);
 gain.gain.exponentialRampToValueAtTime(.001,t0+duration);

 src.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);
 src.start(t0);
 src.stop(t0+duration);
}

function startAmbient(intense){
 const ctx=ensureAudio();
 if(!ctx||ambientNodes)return;

 const osc1=ctx.createOscillator();
 const osc2=ctx.createOscillator();
 const filter=ctx.createBiquadFilter();
 const gain=ctx.createGain();
 const lfo=ctx.createOscillator();
 const lfoGain=ctx.createGain();

 // A boss fight swaps the fifth for a tritone and speeds/deepens the
 // filter LFO — same drone, more tension.
 osc1.type="sine";osc1.frequency.value=55;
 osc2.type="sine";osc2.frequency.value=intense?55*1.414:55*1.5;
 filter.type="lowpass";filter.frequency.value=intense?420:300;
 gain.gain.value=0;
 gain.gain.linearRampToValueAtTime(intense?.07:.05,ctx.currentTime+2);

 lfo.frequency.value=intense?.12:.05;
 lfoGain.gain.value=intense?220:150;
 lfo.connect(lfoGain);
 lfoGain.connect(filter.frequency);

 osc1.connect(filter);
 osc2.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);

 osc1.start();
 osc2.start();
 lfo.start();

 ambientNodes={osc1,osc2,lfo,gain};
}

function stopAmbient(){
 if(!ambientNodes||!audioCtx)return;

 const {osc1,osc2,lfo,gain}=ambientNodes;
 const t=audioCtx.currentTime;

 gain.gain.cancelScheduledValues(t);
 gain.gain.setValueAtTime(gain.gain.value,t);
 gain.gain.linearRampToValueAtTime(0,t+1);
 osc1.stop(t+1.1);
 osc2.stop(t+1.1);
 lfo.stop(t+1.1);

 ambientNodes=null;
}

function resize(){
 const r=canvas.getBoundingClientRect();

 // iOS briefly reports a zero-size rect mid-rotation; skip rather than
 // collapse the canvas's backing buffer to 0x0 (which renders nothing).
 if(!r.width||!r.height)return;

 const scale=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(r.width*scale);
 canvas.height=Math.round(r.height*scale);

 // Publish the stage's letterbox geometry as CSS vars so the touch
 // controls (now positioned relative to the full viewport) can sit in
 // the side bars beside the stage instead of on top of the play field.
 const barL=r.left,barR=innerWidth-r.right;
 const root=document.documentElement.style;
 root.setProperty("--barL",barL+"px");
 root.setProperty("--barR",barR+"px");
 root.setProperty("--stageTop",r.top+"px");
 root.setProperty("--stageBottom",(innerHeight-r.bottom)+"px");
 root.setProperty("--stageW",r.width+"px");
 root.setProperty("--stageH",r.height+"px");

 // Only usable as dedicated rails once they're wide enough for a 76px
 // button plus breathing room; otherwise fall back to overlaying the
 // stage's corners like before.
 touchUI.classList.toggle("bars",barL>=92&&barR>=92);
}
addEventListener("resize",resize);

// ResizeObserver reacts to the actual settled layout size instead of
// guessing a delay after orientationchange, which iOS Safari can fire
// before the rotation's layout has finished settling.
if(window.ResizeObserver){
 new ResizeObserver(resize).observe(canvas);
}else{
 addEventListener("orientationchange",()=>setTimeout(resize,300));
}
resize();

function isFinalBossRoom(){return Math.floor(R.depth/7)===3}

function bossDepthAhead(){
 const next=R.depth+1;
 return next%7===0&&next<=28;
}

function rank(id){return R?.mods?.[id]||0}
function weaponRank(id){return R?.weapons?.[id]||0}
function metaRank(id){return meta.upgrades[id]||0}
function xpNeeded(){return Math.floor(48+R.level*30+Math.pow(R.level,1.35)*5)}
function heal(n){R.hp=Math.min(S.maxHp,R.hp+n)}

function calculate(){
 const f=FRAMES.find(x=>x.id===R.frame)||FRAMES[0];

 S={
  maxHp:f.hp+rank("armor")+metaRank("vitality"),
  speed:f.speed*(1+.12*rank("speed")),
  damage:f.damage*Math.pow(1.24,rank("power")),
  rate:f.rate/Math.pow(1.16,rank("rate")),
  shots:f.shots+rank("spread"),
  pierce:rank("pierce"),
  dashCD:f.dash*Math.pow(.9,rank("dash")),
  dashDamage:70+30*rank("dash"),

  // pulseCost is the energy meter's fill target, not a resource spent
  // elsewhere — lowering it via the pulse mutation means less waiting
  // before the meter reaches "ready," i.e. a faster effective recharge.
 pulseCost:100*Math.pow(.95,rank("pulse")),
pulseDamage:190+70*rank("pulse"),

// Pulse now takes considerably longer to recharge.
energyRate:.48+rank("battery")*.48
 };

 R.hp=Math.min(R.hp,S.maxHp);
 if(P)P.energy=Math.min(P.energy,S.pulseCost);
}

function show(title,sub,cards=[],buttons=[],extra=""){
 state="menu";
 keys.clear();
 actions=[];
 touchUI.classList.remove("active");

 const cardHTML=cards.map((a,i)=>{
  if(!a.disabled)actions[i]=a.fn;
  return `<button type="button" class="card" data-action="${i}" ${a.disabled?"disabled":""}>
   <em>${i+1} / ${esc(a.tag||t("choice_fallback"))}</em>
   <h3>${esc(a.title)}</h3>
   <p>${esc(a.desc||"")}</p>
   ${a.lore?`<p class="lore">${esc(a.lore)}</p>`:""}
   ${a.foot?`<small>${esc(a.foot)}</small>`:""}
  </button>`;
 }).join("");

 const buttonHTML=buttons.map((a,i)=>{
  const n=cards.length+i;
  if(!a.disabled)actions[n]=a.fn;
  return `<button type="button" class="button ${a.secondary?"secondary":""}" data-action="${n}" ${a.disabled?"disabled":""}>${esc(a.title)}</button>`;
 }).join("");

 overlay.innerHTML=`<div class="panel">
  <div class="eyebrow">VOID BLOOM / ECHOES</div>
  <h1>${title}</h1>
  <div class="sub">${sub}</div>
  ${extra}
  ${cards.length?`<div class="cards">${cardHTML}</div>`:""}
  <div class="buttons">${buttonHTML}</div>
  <div class="small">${isTouch?t("show_hint_touch"):t("show_hint_keys")}</div>
 </div>`;

 overlay.classList.remove("hidden");
 overlay.querySelectorAll("[data-action]").forEach(b=>{
  b.addEventListener("click",()=>invoke(Number(b.dataset.action)));
 });
}

function invoke(i){
 const fn=actions[i];
 if(typeof fn!=="function")return;
 wakeAudio();
 enterFullscreen();
 sfx.click();
 actions=[];
 fn();
}

function hide(){
 overlay.classList.add("hidden");
 keys.clear();
 actions=[];
 state="playing";
 if(isTouch)touchUI.classList.add("active");
}

function upgradeCost(u,r){return u.baseCost*(r+1)}

function garden(){
 show(t("tend_garden_title"),
  t("tend_garden_sub"),
  META_UPGRADES.map(u=>{
   const r=metaRank(u.id);
   const maxed=r>=u.max;
   const cost=upgradeCost(u,r);
   const lu=localize(u);

   return {
    title:lu.name,
    tag:maxed?t("maxed"):`${cost} ${t("spores_label")}`,
    desc:lu.desc,
    foot:`${t("rank_label")} ${r}/${u.max}`,
    disabled:maxed||meta.spores<cost,
    fn:()=>{
     meta.spores-=cost;
     meta.upgrades[u.id]=r+1;
     write(META,meta);
     sfx.purchase();
     garden();
    }

  [{title:t("back"),secondary:true,fn:title}],

}

function generateActMap(){
 const pool=["elite","rest","shop","unknown"];
 R.actMap=[];
 R.actPicks=[];

 for(let i=0;i<6;i++){
  R.actMap.push(["combat",...shuffle(pool).slice(0,2)]);
 }

 R.mapAct=Math.floor(R.depth/7);
}

function pathMapHTML(){
 if(!R.actMap)return "";

 const cur=R.depth%7;
 const cells=R.actMap.map((opts,i)=>{
  const st=i<cur?"done":i===cur?"now":"next";
  const pick=R.actPicks&&R.actPicks[i];
  const opts_html=opts.map(id=>
   `<span class="pn-opt${pick===id?" picked":""}" style="--c:${NODE_COLOR[id]}">${NODE_LETTER[id]}</span>`
  ).join("");
  return `<div class="pn ${st}">${opts_html}</div>`;
 }).join("");

 const bossState=cur>=6?"now":"next";

 return `<div class="pathmap">${cells}<div class="pn boss ${bossState}"><span class="pn-opt picked" style="--c:var(--pink)">G</span></div></div>`;
}

function route(){
 room=null;P=null;enemies=[];bullets=[];orbs=[];hazards=[];
 shopStock=null;

 const biome=BIOMES[Math.min(3,Math.floor(R.depth/7))];
 const boss=bossDepthAhead()?BOSSES[Math.floor(R.depth/7)]:null;

 let cards;

 if(boss){
  cards=[
   {title:t("boss_title"),tag:t("guardian_tag"),desc:t("boss_desc")(boss.name),fn:()=>enter("boss")},
   {title:t("shop_title"),tag:`${R.scrap} ${t("scrap_suffix")}`,desc:t("shop_desc"),fn:shop}
  ];
 }else{
  if(R.mapAct!==Math.floor(R.depth/7))generateActMap();

  cards=R.actMap[R.depth%7].map(id=>{
   const info=localize(NODE_INFO[id]);
   return {title:info.title,tag:typeof info.tag==="function"?info.tag():info.tag,desc:info.desc,fn:info.fn};
  });
 }

 const biomeName=localize(biome).name;

 show(`${biomeName.split(" ")[0]} <span>${biomeName.split(" ").slice(1).join(" ")}</span>`,
  boss?t("route_sub_boss"):t("route_sub_normal"),
  cards,
  [
   {title:t("build_btn"),secondary:true,fn:build},
   {title:t("title_btn"),secondary:true,fn:title}
  ],
  `${pathMapHTML()}<div class="small">${t("room_label")} ${R.depth+1} · ${t("level_label")} ${R.level} · HP ${R.hp}/${S.maxHp} · ${t("score_label")} ${R.score}</div>`);
}
